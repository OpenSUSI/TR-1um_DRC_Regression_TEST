rule_id: CO.S1

layers:
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
# スペースチェックに無関係な幅エラーや構造エラー(下地不足・上層不足)を無視
waive_rule_ids:
  - CO.W1
  - CO.Z1
  - CO.Z3

cases:
  # ==========================================
  # 正常系：間隔がぴったり 1.0 (PASS)
  # ==========================================
  - name: pass_space_1p0
    shapes:
      CO: 
        # 1つ目のコンタクト (1.0 x 1.0)
        - [0.0, 0.0, 1.0, 1.0]
        # 2つ目のコンタクト (1.0 + 1.0 = 2.0 から配置)
        - [2.0, 0.0, 3.0, 1.0]
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が 0.95 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_0p95_single
    shapes:
      CO: 
        - [0.0, 0.0, 1.0, 1.0]
        # 隙間を 0.95 にする (1.0 + 0.95 = 1.95)
        - [1.95, 0.0, 2.95, 1.0]
    expected_violations: 1

  # ==========================================
  # 異常系：間隔が 0.95 の箇所が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_0p95_double
    shapes:
      CO: 
        # 中央のコンタクト
        - [5.0, 0.0, 6.0, 1.0]
        # 左側のコンタクト (5.0 から左に 0.95 離す -> X最大値 4.05)
        - [3.05, 0.0, 4.05, 1.0]
        # 右側のコンタクト (6.0 から右に 0.95 離す -> X最小値 6.95)
        - [6.95, 0.0, 7.95, 1.0]
    expected_violations: 2