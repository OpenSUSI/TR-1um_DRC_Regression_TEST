rule_id: CO.AD

layers:
  CO: { number: 11, datatype: 0 }
  AP: { number: 3, datatype: 1 }
  AN: { number: 3, datatype: 2 }
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  # 今回の囲みチェックに無関係なルールをすべて無視
  - CO.W1
  - CO.S1
  - CO.WD
  - CO.Z1
  - CO.Z3
  - CO.AP
  - CO.AN
  - AP.W1
  - AP.S1
  - AP.WN
  - AN.W1
  - AN.S1
  - AN.WN
  - WN.W1
  - WN.S1
  - WN.Z1
  - WN.Z2
  - WN.AP
  - WN.AN

cases:
  # ==========================================
  # 正常系①：AP(D) [WN内] が CO(D) をぴったり 1.2 囲む (PASS)
  # ==========================================
  - name: pass_enclose_1p2_ap
    shapes:
      WN: [[-2.0, -2.0, 5.6, 5.6]]
      # COを全方位 1.2 ずつ囲む (0.0 〜 3.6)
      AP: [[0.0, 0.0, 3.6, 3.6]]
      # 1.2 x 1.2 のコンタクト
      CO: [[1.2, 1.2, 2.4, 2.4]]
    expected_violations: 0

  # ==========================================
  # 正常系②：AN(D) が CO(D) をぴったり 1.2 囲む (PASS)
  # ==========================================
  - name: pass_enclose_1p2_an
    shapes:
      AN: [[0.0, 0.0, 3.6, 3.6]]
      CO: [[1.2, 1.2, 2.4, 2.4]]
    expected_violations: 0

  # ==========================================
  # 異常系①：AP(D) の「右側」の囲みだけ 1.15 に削る -> 違反数: 1
  # ==========================================
  - name: fail_enclose_1p15_ap
    shapes:
      WN: [[-2.0, -2.0, 5.6, 5.6]]
      # 右端(X最大値)を 3.6 から 3.55 に縮める (マージン 1.15)
      AP: [[0.0, 0.0, 3.55, 3.6]]
      CO: [[1.2, 1.2, 2.4, 2.4]]
    expected_violations: 1

  # ==========================================
  # 異常系②：AN(D) の「左側」の囲みだけ 1.15 に削る -> 違反数: 1
  # ==========================================
  - name: fail_enclose_1p15_an
    shapes:
      # 左端(X最小値)を 0.0 から 0.05 に縮める (マージン 1.15)
      AN: [[0.05, 0.0, 3.6, 3.6]]
      CO: [[1.2, 1.2, 2.4, 2.4]]
    expected_violations: 1