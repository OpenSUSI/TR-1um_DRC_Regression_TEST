rule_id: CO.GC

layers:
  CO: { number: 11, datatype: 0 }
  GC: { number: 8, datatype: 1 }
  # GRのレイヤー番号・データタイプは実際の仕様に合わせて修正してください
  GR: { number: 8, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  # 今回の囲みチェックに無関係な単体ルールや浮きエラーをすべて無視
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - GC.W1
  - GC.S1
  - GR.W1
  - GR.S1
  - GR.L1

cases:
  # ==========================================
  # 正常系①：GC が CO をぴったり 0.8 囲む (PASS)
  # ==========================================
  - name: pass_enclose_0p8_gc
    shapes:
      GC: [[0.2, 0.2, 2.8, 2.8]]
      CO: [[1.0, 1.0, 2.0, 2.0]]
    expected_violations: 0

  # ==========================================
  # 正常系②：GR が CO をぴったり 0.8 囲む (PASS)
  # ==========================================
  - name: pass_enclose_0p8_gr
    shapes:
      GR: [[0.2, 0.2, 2.8, 2.8]]
      CO: [[1.0, 1.0, 2.0, 2.0]]
    expected_violations: 0

  # ==========================================
  # 異常系①：GC の「右側」の囲みだけ 0.75 に削る -> 違反数: 1
  # ==========================================
  - name: fail_enclose_0p75_gc
    shapes:
      GC: [[0.2, 0.2, 2.75, 2.8]]
      CO: [[1.0, 1.0, 2.0, 2.0]]
    expected_violations: 1

  # ==========================================
  # 異常系②：GR の「右側」の囲みだけ 0.75 に削る -> 違反数: 1
  # ==========================================
  - name: fail_enclose_0p75_gr
    shapes:
      GR: [[0.2, 0.2, 2.75, 2.8]]
      CO: [[1.0, 1.0, 2.0, 2.0]]
    expected_violations: 1