rule_id: CO.GG

layers:
  CO: { number: 11, datatype: 0 }
  GC: { number: 8, datatype: 1 }
  AP: { number: 3, datatype: 1 }
  AN: { number: 3, datatype: 2 }
  # PMOSを正しく認識させるためのNウェルを追加
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  # 無関係なエラーを徹底的に無視
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - CO.AP
  - CO.AN
  - CO.GC
  - GC.W1
  - GC.S1
  - GC.EP
  - GC.EN
  - GC.AP
  - GC.AN
  - AP.W1
  - AP.S1
  - AP.WM
  - AP.LM
  - AP.WN
  - AN.W1
  - AN.S1
  - AN.WM
  - AN.LM
  - AN.WN
  # WN追加に伴う無視リスト
  - WN.W1
  - WN.S1
  - WN.Z1
  - WN.Z2

cases:
  # ==========================================
  # 正常系①：PMOSのゲートとコンタクトの間隔がぴったり 1.0 (PASS)
  # ==========================================
  - name: pass_space_1p0_pmos
    shapes:
      WN: [[-2.0, -2.0, 12.0, 12.0]] # APを覆ってPMOS化する
      AP: [[0.0, 0.0, 10.0, 10.0]]
      GC: [[4.0, -2.0, 6.0, 12.0]]
      CO: [[2.0, 4.0, 3.0, 5.0]]
    expected_violations: 0

  # ==========================================
  # 正常系②：NMOSのゲートとコンタクトの間隔がぴったり 1.0 (PASS)
  # ==========================================
  - name: pass_space_1p0_nmos
    shapes:
      AN: [[0.0, 0.0, 10.0, 10.0]]
      GC: [[4.0, -2.0, 6.0, 12.0]]
      CO: [[2.0, 4.0, 3.0, 5.0]]
    expected_violations: 0

  # ==========================================
  # 異常系①：PMOSで間隔が 0.95 (FAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_0p95_pmos
    shapes:
      WN: [[-2.0, -2.0, 12.0, 12.0]] # APを覆ってPMOS化する
      AP: [[0.0, 0.0, 10.0, 10.0]]
      GC: [[4.0, -2.0, 6.0, 12.0]]
      # X=3.05 にしてゲート(4.0)との隙間を 0.95 にする
      CO: [[2.05, 4.0, 3.05, 5.0]]
    expected_violations: 1

  # ==========================================
  # 異常系②：NMOSで間隔が 0.95 (FAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_0p95_nmos
    shapes:
      AN: [[0.0, 0.0, 10.0, 10.0]]
      GC: [[4.0, -2.0, 6.0, 12.0]]
      CO: [[2.05, 4.0, 3.05, 5.0]]
    expected_violations: 1