rule_id: GC.AN

layers:
  GC: { number: 8, datatype: 1 }
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
# 異層間スペースに無関係な各レイヤーの単体ルール等を無視
waive_rule_ids:
  - GC.W1
  - GC.S1
  - AN.W1
  - AN.S1
  - GC.R1
  - GC.R2
  - GC.ANT
  - AN.WN  # Nウェルがないことによるエラーが出た場合の保険
  - DN.W1

cases:
  # ==========================================
  # 正常系：間隔がぴったり 0.4 (PASS)
  # ==========================================
  - name: pass_space_0p4
    shapes:
      GC: 
        - [0.0, 0.0, 2.0, 10.0]
      AN: 
        # GCの右端(2.0)から 0.4 離して配置
        - [2.4, 0.0, 4.4, 10.0] 
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が 0.35 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_0p35_single
    shapes:
      GC: 
        - [0.0, 0.0, 2.0, 10.0]
      AN: 
        # 隙間を 0.35 にする (2.0 + 0.35 = 2.35)
        - [2.35, 0.0, 4.35, 10.0] 
    expected_violations: 1

  # ==========================================
  # 異常系：間隔が 0.35 の箇所が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_0p35_double
    shapes:
      GC: 
        # 中央のGC
        - [5.0, 0.0, 7.0, 10.0]
      AN: 
        # 左側のAN (5.0 から左に 0.35 離す -> X最大値 4.65)
        - [2.65, 0.0, 4.65, 10.0] 
        # 右側のAN (7.0 から右に 0.35 離す -> X最小値 7.35)
        - [7.35, 0.0, 9.35, 10.0] 
    expected_violations: 2