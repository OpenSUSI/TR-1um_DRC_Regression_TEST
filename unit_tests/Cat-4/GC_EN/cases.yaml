rule_id: GC.EN

layers:
  GC: { number: 8, datatype: 1 }
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  - GC.W1
  - GC.S1
  - AN.W1
  - AN.S1
  - GC.EP # PMOS用のEndcapルールなので無視
  - AN.WN # Nウェル関連エラーが出た場合の保険

cases:
  # ==========================================
  # 正常系：左右の端部マージンが両方 1.2以上 (PASS)
  # ==========================================
  - name: pass_endcap_1p2
    shapes:
      AN:
        - [0.0, 0.0, 10.0, 10.0]
      GC:
        # 左側 1.2, 右側 1.2 のはみ出し
        - [-1.2, 0.0, 11.2, 10.0]
    expected_violations: 0

  # ==========================================
  # 異常系：片側だけ 1.15 (FAIL) -> 違反数: 1
  # ==========================================
  - name: fail_endcap_1p15_single
    shapes:
      AN:
        - [0.0, 0.0, 10.0, 10.0]
      GC:
        # 左側は 1.5 確保し安全圏。右側だけ 1.15 にして意図的にエラーを起こす
        - [-1.5, 0.0, 11.15, 10.0]
    expected_violations: 1

  # ==========================================
  # 異常系：左右両方とも 1.15 (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_endcap_1p15_double
    shapes:
      AN:
        - [0.0, 0.0, 10.0, 10.0]
      GC:
        # 左側 1.15, 右側 1.15 (2箇所でエラー発火)
        - [-1.15, 0.0, 11.15, 10.0]
    expected_violations: 2