rule_id: GC.S1

layers:
  GC: { number: 8, datatype: 1 }

allow_other_rules: false
# スペースチェックに無関係な単体ルール等を無視
waive_rule_ids:
  - GC.W1
  - GC.R1
  - GC.R2
  - GC.ANT

cases:
  # ==========================================
  # 正常系：間隔がぴったり 1.2 (PASS)
  # ==========================================
  - name: pass_space_1p2
    shapes:
      GC: 
        # 1つ目の配線
        - [0.0, 0.0, 2.0, 10.0]
        # 2つ目の配線 (2.0 + 1.2 = 3.2 から配置)
        - [3.2, 0.0, 5.2, 10.0] 
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が 1.15 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_1p15_single
    shapes:
      GC: 
        - [0.0, 0.0, 2.0, 10.0]
        # 隙間を1.15にする (2.0 + 1.15 = 3.15)
        - [3.15, 0.0, 5.15, 10.0] 
    expected_violations: 1

  # ==========================================
  # 異常系：間隔が 1.15 の箇所が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_1p15_double
    shapes:
      GC: 
        # 中央の配線
        - [5.0, 0.0, 7.0, 10.0]
        # 左側の配線 (5.0 から左に 1.15 離す -> X最大値 3.85)
        - [1.85, 0.0, 3.85, 10.0] 
        # 右側の配線 (7.0 から右に 1.15 離す -> X最小値 8.15)
        - [8.15, 0.0, 10.15, 10.0] 
    expected_violations: 2