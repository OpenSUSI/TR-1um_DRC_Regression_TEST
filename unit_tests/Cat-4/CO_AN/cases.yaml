rule_id: CO.AN

layers:
  CO: { number: 11, datatype: 0 }
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  # 今回のテストに無関係なエラーと、干渉する CO.AD などを無視
  - CO.W1
  - CO.S1
  - CO.WD
  - CO.AD   # 1.2マージン要求を無視する
  - CO.Z1
  - CO.Z3
  - AN.W1
  - AN.S1
  - AN.WN
  # ANから自動生成されるDN関連のエラーを無視
  - DN.W1
  - DN.S1
  - DN.AN

cases:
  # ==========================================
  # 正常系：AN が CO をぴったり 0.8 囲む (PASS)
  # ==========================================
  - name: pass_enclose_0p8
    shapes:
      # CO(1.0x1.0) を全方位 0.8 ずつ囲む (0.2 〜 2.8)
      AN: [[0.2, 0.2, 2.8, 2.8]]
      # 1.0 x 1.0 のコンタクト
      CO: [[1.0, 1.0, 2.0, 2.0]]
    expected_violations: 0

  # ==========================================
  # 異常系：AN の「右側」の囲みだけ 0.75 に削る -> 違反数: 1
  # ==========================================
  - name: fail_enclose_0p75_single
    shapes:
      # 右端(X最大値)を 2.8 から 2.75 に縮める (マージン 0.75)
      AN: [[0.2, 0.2, 2.75, 2.8]]
      CO: [[1.0, 1.0, 2.0, 2.0]]
    expected_violations: 1

  # ==========================================
  # 異常系：違反するコンタクトを2つ配置 -> 違反数: 2
  # ==========================================
  - name: fail_enclose_0p75_double
    shapes:
      AN: 
        # 1つ目 (右側マージン 0.75)
        - [0.2, 0.2, 2.75, 2.8]
        # 2つ目 (右側マージン 0.75)
        - [5.2, 0.2, 7.75, 2.8]
      CO: 
        - [1.0, 1.0, 2.0, 2.0]
        - [6.0, 1.0, 7.0, 2.0]
    expected_violations: 2