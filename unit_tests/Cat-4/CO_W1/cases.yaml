rule_id: CO.W1

layers:
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
# 幅チェックに無関係なエラー（間隔や、下地・上層メタル不足）を無視
waive_rule_ids:
  - CO.S1
  - CO.Z1
  - CO.Z3

cases:
  # ==========================================
  # 正常系：幅がぴったり 1.0 (PASS)
  # ==========================================
  - name: pass_width_1p0
    shapes:
      CO: 
        # 1.0 x 1.0 のコンタクト
        - [0.0, 0.0, 1.0, 1.0]
    expected_violations: 0

  # ==========================================
  # 異常系：幅が 0.95 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_width_0p95_single
    shapes:
      CO: 
        # X方向の幅を0.95に縮める
        - [0.0, 0.0, 0.95, 1.0]
    expected_violations: 1

  # ==========================================
  # 異常系：幅が 0.95 のコンタクトが2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_width_0p95_double
    shapes:
      CO: 
        - [0.0, 0.0, 0.95, 1.0]
        # CO.S1(間隔1.0)に引っかからないよう十分に離す
        - [5.0, 0.0, 5.95, 1.0]
    expected_violations: 2