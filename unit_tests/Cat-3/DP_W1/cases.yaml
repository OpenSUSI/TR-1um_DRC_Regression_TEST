rule_id: DP.W1

layers:
  AP: { number: 3, datatype: 1 }
  WN: { number: 140, datatype: 0 } # DP抽出のトリガーとして追加

allow_other_rules: false
# 発生しうる単体・構造エラーを無視リストに追加
waive_rule_ids:
  - DP.S1
  - DP.AP
  - AP.W1
  - AP.S1
  - AP.WN
  - WN.W1
  - WN.S1
  - WN.Z1
  - WN.Z2

cases:
  # ==========================================
  # 正常系：幅がぴったり 3.60 (PASS)
  # ==========================================
  - name: pass_width_3p60
    shapes:
      WN: # AP全体を覆うように配置
        - [-5.0, -5.0, 10.0, 20.0]
      AP: 
        - [0.0, 0.0, 3.6, 15.0]
    expected_violations: 0

  # ==========================================
  # 異常系：幅が 3.55 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_width_3p55_single
    shapes:
      WN:
        - [-5.0, -5.0, 10.0, 20.0]
      AP: 
        - [0.0, 0.0, 3.55, 15.0]
    expected_violations: 1

  # ==========================================
  # 異常系：幅が 3.55 の図形が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_width_3p55_double
    shapes:
      WN: # 2つのAP両方を覆うようにX方向へ拡大
        - [-5.0, -5.0, 20.0, 20.0]
      AP: 
        - [0.0, 0.0, 3.55, 15.0]
        - [10.0, 0.0, 13.55, 15.0]
    expected_violations: 2