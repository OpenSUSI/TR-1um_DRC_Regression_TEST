rule_id: AN.AP

layers:
  AN: { number: 3, datatype: 2 }
  AP: { number: 3, datatype: 1 }

allow_other_rules: false
# 異層間スペースの検証に集中するため、関連する単体エラーや構造エラーを無視
waive_rule_ids:
  - AN.W1
  - AN.S1
  - AN.WN
  - AP.W1
  - AP.S1
  - AP.WN
  - WN.AN
  - DN.AP
  - AP.AN  # 逆向きの同種ルールが発火するのを防ぐ

cases:
  # ==========================================
  # 正常系：間隔が 2.80 (PASS)
  # ==========================================
  - name: pass_space_2p80
    shapes:
      AN:
        - [0.0, 0.0, 10.0, 10.0]
      AP: # ANの右端(10.0)から2.8空けて配置
        - [12.8, 0.0, 22.8, 10.0]
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が 2.75 (FAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_2p75_single
    shapes:
      AN:
        - [0.0, 0.0, 10.0, 10.0]
      AP: # 2.75しか空いていない(0.05不足)
        - [12.75, 0.0, 22.75, 10.0]
    expected_violations: 1

  # ==========================================
  # 異常系：間隔が 2.75 の箇所が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_2p75_double
    shapes:
      AN: # 中央に配置
        - [10.0, 0.0, 20.0, 10.0]
      AP:
        # 左側のAP (10.0から左に2.75離す -> X最大値が7.25)
        - [-2.75, 0.0, 7.25, 10.0]
        # 右側のAP (20.0から右に2.75離す -> X最小値が22.75)
        - [22.75, 0.0, 32.75, 10.0]
    expected_violations: 2