rule_id: AN.W1

layers:
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
# 検証に無関係なスペースエラーや構造エラーを無視
waive_rule_ids:
  - AN.S1
  - AN.WN
  - WN.AN
  - DN.W1

cases:
  # ==========================================
  # 正常系：幅がぴったり 1.40 (PASS)
  # ==========================================
  - name: pass_width_1p40
    shapes:
      AN: 
        - [0.0, 0.0, 1.4, 10.0]
    expected_violations: 0

  # ==========================================
  # 異常系：幅が 1.35 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_width_1p35_single
    shapes:
      AN: 
        - [0.0, 0.0, 1.35, 10.0]
    expected_violations: 1

  # ==========================================
  # 異常系：幅が 1.35 の図形が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_width_1p35_double
    shapes:
      AN: 
        - [0.0, 0.0, 1.35, 10.0]
        # スペースエラーを避けるため、X座標を5.0離して配置
        - [5.0, 0.0, 6.35, 10.0] 
    expected_violations: 2