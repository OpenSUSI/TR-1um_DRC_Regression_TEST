rule_id: AP.WM

layers:
  AP: { number: 3, datatype: 1 }
  GC: { number: 8, datatype: 1 }
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
# 構成上発生しうる他のサイズ/スペースエラーを無視リストに登録
waive_rule_ids:
  - AP.W1
  - AP.S1
  - AP.WN
  - GC.W1
  - GC.S1
  - WN.W1
  - WN.S1
  - WN.Z2

cases:
  # ==========================================
  # 正常系：幅が最小値の 3.4 (PASS)
  # ==========================================
  - name: pass_width_3p4
    shapes:
      WN: # PMOSとするためのNウェル
        - [-5.0, -5.0, 15.0, 8.4]
      AP: # 幅(Y方向)が 3.4 のアクティブ領域
        - [0.0, 0.0, 10.0, 3.4]
      GC: # 中央を縦に横切るゲート (X: 4.0 〜 6.0)
        - [4.0, -2.0, 6.0, 5.4]
    expected_violations: 0

  # ==========================================
  # 正常系：幅が最大値の 60.0 (PASS)
  # ==========================================
  - name: pass_width_60p0
    shapes:
      WN:
        - [-5.0, -5.0, 15.0, 65.0]
      AP: # 幅(Y方向)が 60.0 のアクティブ領域
        - [0.0, 0.0, 10.0, 60.0]
      GC:
        - [4.0, -2.0, 6.0, 62.0]
    expected_violations: 0

  # ==========================================
  # 異常系：幅が最小値未満の 3.35 (FAIL)
  # ==========================================
  - name: fail_width_3p35_min
    shapes:
      WN:
        - [-5.0, -5.0, 15.0, 8.35]
      AP: # 幅(Y方向)が 3.35 (0.05不足)
        - [0.0, 0.0, 10.0, 3.35]
      GC:
        - [4.0, -2.0, 6.0, 5.35]
    # ※AP-GC(ソースとドレインの2箇所)がそれぞれエラー判定される想定で「2」としています。
    # もしActual: 1 と出る場合は、ツールが1つのトランジスタとしてまとめているため 1 に修正してください。
    expected_violations: 2

  # ==========================================
  # 異常系：幅が最大値超過の 60.05 (FAIL)
  # ==========================================
  - name: fail_width_60p05_max
    shapes:
      WN:
        - [-5.0, -5.0, 15.0, 65.05]
      AP: # 幅(Y方向)が 60.05 (0.05超過)
        - [0.0, 0.0, 10.0, 60.05]
      GC:
        - [4.0, -2.0, 6.0, 62.05]
    expected_violations: 2