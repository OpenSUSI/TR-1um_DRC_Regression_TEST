rule_id: AN.WM

layers:
  AN: { number: 3, datatype: 2 }
  GC: { number: 8, datatype: 1 }

allow_other_rules: false
# 構成上発生しうる他のエラーを徹底的に無視
waive_rule_ids:
  - AN.W1
  - AN.S1
  - AN.LM   # チャネル長(L)の検証ルールが干渉するのを防ぐ
  - GC.W1
  - GC.S1

cases:
  # ==========================================
  # 正常系：幅が最小値の 3.4 (PASS)
  # ==========================================
  - name: pass_width_3p4
    shapes:
      AN: # 幅(Y方向)が 3.4 のアクティブ領域
        - [0.0, 0.0, 10.0, 3.4]
      GC: # 中央を縦に横切るゲート (X: 4.0 〜 6.0)
        - [4.0, -2.0, 6.0, 5.4]
    expected_violations: 0

  # ==========================================
  # 正常系：幅が最大値の 60.0 (PASS)
  # ==========================================
  - name: pass_width_60p0
    shapes:
      AN: # 幅(Y方向)が 60.0 のアクティブ領域
        - [0.0, 0.0, 10.0, 60.0]
      GC:
        - [4.0, -2.0, 6.0, 62.0]
    expected_violations: 0

  # ==========================================
  # 異常系：幅が最小値未満の 3.35 (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_width_3p35_min
    shapes:
      AN: # 幅(Y方向)が 3.35 (0.05不足)
        - [0.0, 0.0, 10.0, 3.35]
      GC:
        - [4.0, -2.0, 6.0, 5.35]
    expected_violations: 2

  # ==========================================
  # 異常系：幅が最大値超過の 60.05 (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_width_60p05_max
    shapes:
      AN: # 幅(Y方向)が 60.05 (0.05超過)
        - [0.0, 0.0, 10.0, 60.05]
      GC:
        - [4.0, -2.0, 6.0, 62.05]
    expected_violations: 2