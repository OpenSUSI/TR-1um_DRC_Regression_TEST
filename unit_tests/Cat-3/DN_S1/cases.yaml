rule_id: DN.S1

layers:
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
# 検証に無関係な派生元のルールや、DNの幅エラーなどを徹底的に無視
waive_rule_ids:
  - DN.W1
  - DN.AN
  - AN.W1
  - AN.S1
  - AN.WN
  - WN.AN

cases:
  # ==========================================
  # 正常系：間隔がぴったり 1.40 (PASS)
  # ==========================================
  - name: pass_space_1p40
    shapes:
      AN: 
        # 1つ目の図形 (幅は十分に取る)
        - [0.0, 0.0, 5.0, 10.0]
        # 2つ目の図形 (5.0 + 1.4 = 6.4 から配置)
        - [6.4, 0.0, 11.4, 10.0] 
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が 1.35 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_1p35_single
    shapes:
      AN: 
        - [0.0, 0.0, 5.0, 10.0]
        # 隙間を1.35にする (5.0 + 1.35 = 6.35)
        - [6.35, 0.0, 11.35, 10.0] 
    expected_violations: 1

  # ==========================================
  # 異常系：間隔が 1.35 の箇所が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_1p35_double
    shapes:
      AN: 
        - [0.0, 0.0, 5.0, 10.0]
        # 1つ目の隙間 1.35
        - [6.35, 0.0, 11.35, 10.0] 
        # 2つ目の隙間 1.35 (11.35 + 1.35 = 12.7)
        - [12.70, 0.0, 17.70, 10.0] 
    expected_violations: 2