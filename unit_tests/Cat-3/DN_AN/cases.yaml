rule_id: DN.AN

layers:
  AN: { number: 3, datatype: 2 }
  GC: { number: 8, datatype: 1 } # AN(M) を作り出すためのゲート

allow_other_rules: false
# 構造チェックに専念するため、関連する単体・物理層スペースルールを徹底的に無視
waive_rule_ids:
  - DN.W1
  - DN.S1
  - AN.W1
  - AN.S1  # 同じANレイヤー同士なのでベースのスペースルールを防ぐ
  - AN.WM
  - AN.LM
  - AN.WN
  - GC.W1
  - GC.S1
  - WN.AN

cases:
  # ==========================================
  # 正常系：間隔が 2.80 (PASS)
  # ==========================================
  - name: pass_space_2p80
    shapes:
      AN:
        # 1つ目: 単独のAN (= DN)
        - [0.0, 0.0, 10.0, 10.0]
        # 2つ目: GCと交差するAN (= AN(M))。右端(10.0)から2.8空けて配置
        - [12.8, 0.0, 22.8, 10.0]
      GC:
        # 2つ目のANの中央を横切るゲート
        - [16.8, -2.0, 18.8, 12.0]
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が 2.75 (FAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_2p75_single
    shapes:
      AN:
        # 1つ目: 単独のAN (= DN)
        - [0.0, 0.0, 10.0, 10.0]
        # 2つ目: GCと交差するAN (= AN(M))。2.75しか空いていない
        - [12.75, 0.0, 22.75, 10.0]
      GC:
        - [16.75, -2.0, 18.75, 12.0]
    expected_violations: 1

  # ==========================================
  # 異常系：間隔が 2.75 の箇所が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_2p75_double
    shapes:
      AN:
        # 中央: GCと交差するAN (= AN(M))
        - [10.0, 0.0, 20.0, 10.0]
        # 左側: 単独のAN (= DN)。10.0から左に2.75離す
        - [-2.75, 0.0, 7.25, 10.0]
        # 右側: 単独のAN (= DN)。20.0から右に2.75離す
        - [22.75, 0.0, 32.75, 10.0]
      GC:
        # 中央のANを横切るゲート
        - [14.0, -2.0, 16.0, 12.0]
    expected_violations: 2