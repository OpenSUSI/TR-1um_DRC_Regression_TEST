rule_id: AP.LM

layers:
  AP: { number: 3, datatype: 1 }
  AN: { number: 3, datatype: 2 } # 仕様書通りの交差(GC-AN)を成立させるためのダミー
  GC: { number: 8, datatype: 1 }
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - AP.W1
  - AP.S1
  - AP.WM
  - AP.WN
  - AN.W1
  - AN.S1
  - AN.WM
  - AN.LM
  - AN.WN
  - GC.W1
  - GC.S1
  - WN.W1
  - WN.S1
  - WN.Z1
  - WN.Z2

cases:
  # ==========================================
  # 正常系：チャネル長 1.0 (PASS)
  # ==========================================
  - name: true_length_1p0
    shapes:
      WN:
        - [-5.0, -5.0, 20.0, 45.0]
      AP: 
        - [0.0, 0.0, 15.0, 40.0]
      AN: # APと完全に重ねる
        - [0.0, 0.0, 15.0, 40.0]
      GC:
        - [5.0, -2.0, 6.0, 42.0]
    expected_violations: 0

  # ==========================================
  # 異常系：チャネル長 0.95 (FAIL) -> 違反数: 2
  # ==========================================
  - name: false_length_0p95_min
    shapes:
      WN:
        - [-5.0, -5.0, 20.0, 45.0]
      AP:
        - [0.0, 0.0, 15.0, 40.0]
      AN:
        - [0.0, 0.0, 15.0, 40.0]
      GC:
        - [5.0, -2.0, 5.95, 42.0]
    expected_violations: 2

  # ==========================================
  # 正常系：チャネル長 30.0 (PASS)
  # ==========================================
  - name: true_length_30p0
    shapes:
      WN:
        - [-5.0, -5.0, 50.0, 45.0]
      AP:
        - [0.0, 0.0, 45.0, 40.0]
      AN:
        - [0.0, 0.0, 45.0, 40.0]
      GC:
        - [5.0, -2.0, 35.0, 42.0]
    expected_violations: 0

  # ==========================================
  # 異常系：チャネル長 30.05 (FAIL) -> 違反数: 2
  # ==========================================
  - name: false_length_30p05_max
    shapes:
      WN:
        - [-5.0, -5.0, 50.0, 45.0]
      AP:
        - [0.0, 0.0, 45.0, 40.0]
      AN:
        - [0.0, 0.0, 45.0, 40.0]
      GC:
        - [5.0, -2.0, 35.05, 42.0]
    expected_violations: 2