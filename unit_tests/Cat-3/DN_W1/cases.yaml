rule_id: DN.W1

layers:
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
# 検証に無関係な派生元(AN)のルールやスペースエラーを無視
waive_rule_ids:
  - DN.S1
  - DN.AP
  - AN.W1
  - AN.S1
  - AN.WN
  - WN.AN

cases:
  # ==========================================
  # 正常系：幅がぴったり 3.60 (PASS)
  # ==========================================
  - name: pass_width_3p60
    shapes:
      AN: # ツール内部でDNとして抽出される単独のAN
        - [0.0, 0.0, 3.6, 15.0]
    expected_violations: 0

  # ==========================================
  # 異常系：幅が 3.55 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_width_3p55_single
    shapes:
      AN: 
        - [0.0, 0.0, 3.55, 15.0]
    expected_violations: 1

  # ==========================================
  # 異常系：幅が 3.55 の図形が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_width_3p55_double
    shapes:
      AN: 
        - [0.0, 0.0, 3.55, 15.0]
        # スペースエラーを避けるため、X座標を離して配置
        - [10.0, 0.0, 13.55, 15.0]
    expected_violations: 2