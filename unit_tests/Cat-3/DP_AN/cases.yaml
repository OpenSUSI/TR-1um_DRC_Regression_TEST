rule_id: DP.AN

layers:
  AP: { number: 3, datatype: 1 }
  AN: { number: 3, datatype: 2 }
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
# 異層間スペースの検証に集中するため、関連する構造エラーや単体エラーを徹底的に無視
waive_rule_ids:
  - DP.W1
  - DP.S1
  - DP.AP
  - AP.W1
  - AP.S1
  - AP.WN
  - AP.AN  # DPは物理的にAPなので、ベースのAP-ANルールが発火するのを防ぐ
  - AN.W1
  - AN.S1
  - AN.WN
  - AN.AP
  - WN.W1
  - WN.S1
  - WN.Z1
  - WN.Z2
  - WN.AN
  - DN.AP

cases:
  # ==========================================
  # 正常系：間隔が 2.80 (PASS)
  # ==========================================
  - name: pass_space_2p80
    shapes:
      WN: # APを覆うように配置 (DPとして抽出させるため)
        - [-2.0, -2.0, 12.0, 12.0]
      AP: # WN内のAP (=DP)
        - [0.0, 0.0, 10.0, 10.0]
      AN: # DPの右端(10.0)から2.8空けて配置
        - [12.8, 0.0, 22.8, 10.0]
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が 2.75 (FAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_2p75_single
    shapes:
      WN:
        - [-2.0, -2.0, 12.0, 12.0]
      AP:
        - [0.0, 0.0, 10.0, 10.0]
      AN: # 2.75しか空いていない(0.05不足)
        - [12.75, 0.0, 22.75, 10.0]
    expected_violations: 1

  # ==========================================
  # 異常系：間隔が 2.75 の箇所が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_2p75_double
    shapes:
      WN: # 中央のAPを覆う
        - [8.0, -2.0, 22.0, 12.0]
      AP: # 中央に配置
        - [10.0, 0.0, 20.0, 10.0]
      AN:
        # 左側のAN (10.0から左に2.75離す -> X最大値が7.25)
        - [-2.75, 0.0, 7.25, 10.0]
        # 右側のAN (20.0から右に2.75離す -> X最小値が22.75)
        - [22.75, 0.0, 32.75, 10.0]
    expected_violations: 2