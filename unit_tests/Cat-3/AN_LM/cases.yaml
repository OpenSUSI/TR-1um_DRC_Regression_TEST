rule_id: AN.LM

layers:
  AN: { number: 3, datatype: 2 }
  GC: { number: 8, datatype: 1 }

allow_other_rules: false
# 構成上発生しうる他の単体エラー・構造エラーを無視
waive_rule_ids:
  - AN.W1
  - AN.S1
  - AN.WM   # チャネル幅(W)の検証ルールが干渉するのを防ぐ
  - GC.W1
  - GC.S1

cases:
  # ==========================================
  # 正常系：チャネル長が最小値の 1.0 (PASS)
  # ==========================================
  - name: pass_length_1p0
    shapes:
      AN: # 短辺誤判定を防ぐため、Y方向の幅を 40.0 に拡大
        - [0.0, 0.0, 15.0, 40.0]
      GC: # X方向の太さが 1.0 (5.0 〜 6.0)
        - [5.0, -2.0, 6.0, 42.0]
    expected_violations: 0

  # ==========================================
  # 正常系：チャネル長が最大値の 30.0 (PASS)
  # ==========================================
  - name: pass_length_30p0
    shapes:
      AN:
        - [0.0, 0.0, 45.0, 40.0]
      GC: # X方向の太さが 30.0 (5.0 〜 35.0)
        - [5.0, -2.0, 35.0, 42.0]
    expected_violations: 0

  # ==========================================
  # 異常系：チャネル長が最小値未満の 0.95 (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_length_0p95_min
    shapes:
      AN:
        - [0.0, 0.0, 15.0, 40.0]
      GC: # X方向の太さが 0.95 (5.0 〜 5.95)
        - [5.0, -2.0, 5.95, 42.0]
    expected_violations: 2

  # ==========================================
  # 異常系：チャネル長が最大値超過の 30.05 (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_length_30p05_max
    shapes:
      AN:
        - [0.0, 0.0, 45.0, 40.0]
      GC: # X方向の太さが 30.05 (5.0 〜 35.05)
        - [5.0, -2.0, 35.05, 42.0]
    expected_violations: 2