rule_id: AP.S1

layers:
  AP: { number: 3, datatype: 1 }

allow_other_rules: false
waive_rule_ids:
  - AP.W1  # 配線幅エラー(AP.W1)を念のため無視

cases:
  # 正常系：間隔がぴったり1.40（最小値クリア）
  - name: pass_space_1p40
    shapes:
      AP: 
        # 1つ目の図形
        - [0.0, 0.0, 5.0, 10.0]
        # 2つ目の図形（X座標5.0から1.4空けて6.4から配置）
        - [6.4, 0.0, 11.4, 10.0] 
    expected_violations: 0

  # 異常系：間隔が1.35（0.05足りないためエラーが1つ）
  - name: fail_space_1p35_single
    shapes:
      AP: 
        - [0.0, 0.0, 5.0, 10.0]
        # 隙間を1.35にする（5.0 + 1.35 = 6.35）
        - [6.35, 0.0, 11.35, 10.0] 
    expected_violations: 1

  # 異常系：間隔が1.35の箇所が2つ（エラーが2つ検知されるか確認）
  - name: fail_space_1p35_double
    shapes:
      AP: 
        - [0.0, 0.0, 5.0, 10.0]
        # 1つ目の隙間 1.35
        - [6.35, 0.0, 11.35, 10.0] 
        # 2つ目の隙間 1.35（11.35 + 1.35 = 12.7）
        - [12.70, 0.0, 17.70, 10.0] 
    expected_violations: 2