rule_id: AN.WN

layers:
  AN: { number: 3, datatype: 2 }
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
# ログで検知されていた無関係なルール（WN.ANなどのスペースルール等）を徹底的に無視
waive_rule_ids:
  - AN.W1
  - AN.S1
  - WN.W1
  - WN.S1
  - WN.Z1
  - WN.Z2
  - WN.AN
  - DN.AN

cases:
  # ==========================================
  # 正常系：WNがANを全方向から 5.0 で囲んでいる (PASS)
  # ==========================================
  - name: pass_enclose_5p0
    shapes:
      WN: # ANの座標から上下左右にちょうど 5.0 ずつ広げたサイズ
        - [-5.0, -5.0, 15.0, 15.0]
      AN:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 0

  # ==========================================
  # 異常系：左側だけ囲みが 4.95 (0.05不足) -> 違反数: 1
  # ==========================================
  - name: fail_enclose_4p95_single
    shapes:
      WN: # 左辺(-5.0)を右に0.05削って -4.95 にする
        - [-4.95, -5.0, 15.0, 15.0]
      AN:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 1

  # ==========================================
  # 異常系：左右の2箇所の囲みが 4.95 (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_enclose_4p95_double
    shapes:
      WN: # 左辺(-4.95)と右辺(14.95)をそれぞれ削る
        - [-4.95, -5.0, 14.95, 15.0]
      AN:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 2