rule_id: DP.S1

layers:
  AP: { number: 3, datatype: 1 }
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
# 構造エラーを無視リストに追加
waive_rule_ids:
  - DP.W1
  - DP.AP
  - AP.W1
  - AP.S1
  - AP.WN
  - WN.W1
  - WN.S1
  - WN.Z1
  - WN.Z2

cases:
  # ==========================================
  # 正常系：間隔が 1.40 (PASS)
  # ==========================================
  - name: pass_space_1p40
    shapes:
      WN:
        - [-5.0, -5.0, 20.0, 20.0]
      AP:
        - [0.0, 0.0, 5.0, 10.0]
        # 0.0 + 5.0 + 1.4 = 6.4 から配置
        - [6.4, 0.0, 11.4, 10.0]
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が 1.35 (FAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_1p35_single
    shapes:
      WN:
        - [-5.0, -5.0, 20.0, 20.0]
      AP:
        - [0.0, 0.0, 5.0, 10.0]
        # 隙間 1.35
        - [6.35, 0.0, 11.35, 10.0]
    expected_violations: 1

  # ==========================================
  # 異常系：間隔 1.35 の箇所が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_1p35_double
    shapes:
      WN:
        - [-5.0, -5.0, 30.0, 20.0]
      AP:
        - [0.0, 0.0, 5.0, 10.0]
        - [6.35, 0.0, 11.35, 10.0]
        # 11.35 + 1.35 = 12.7
        - [12.7, 0.0, 17.7, 10.0]
    expected_violations: 2