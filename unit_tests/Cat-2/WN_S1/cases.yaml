rule_id: WN.S1

layers:
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - WN.W1
  - WN.S7

cases:
  # ==========================================
  # 正常系：基準寸法 4.0 を満たすスペース (PASS)
  # ==========================================
  - name: pass_space_4p0
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [24.0, 0.0, 44.0, 30.0] # 20.0 + 4.0 = 24.0
    expected_violations: 0

  # ==========================================
  # 異常系：隙間が 3.95 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_3p95_single
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [23.95, 0.0, 43.95, 30.0] # 20.0 + 3.95 = 23.95
    expected_violations: 1

  # ==========================================
  # 異常系：隙間が 3.95 のエラーが2箇所 (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_3p95_double
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [23.95, 0.0, 43.95, 30.0] # 1つ目の隙間 3.95
        - [47.9, 0.0, 67.9, 30.0]   # 2つ目の隙間 3.95 (43.95 + 3.95 = 47.9)
    expected_violations: 2