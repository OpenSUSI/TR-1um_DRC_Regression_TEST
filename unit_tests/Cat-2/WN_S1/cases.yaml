rule_id: WN.S1

layers:
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  # スペース(Space)のテストなので、ウェル幅(Width)のエラー(WN.W1)を無視します
  - WN.W1

cases:
  # パターン1：基準寸法 12.0 を満たすスペース（PASS）
  - name: pass_space_12p0
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [32.0, 0.0, 52.0, 30.0] # 左の図形から 12.0 離して配置 (20.0 + 12.0 = 32.0)
    expected_violations: 0

  # パターン2：隙間が 11.95 しかないエラー (違反数: 1)
  - name: fail_space_11p95_single
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [31.95, 0.0, 51.95, 30.0] # 隙間を 11.95 に設定 (20.0 + 11.95 = 31.95)
    expected_violations: 1

  # パターン3：隙間が 11.95 のエラーが2箇所 (違反数: 2)
  - name: fail_space_11p95_double
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [31.95, 0.0, 51.95, 30.0] # 1つ目の隙間 11.95
        - [63.9, 0.0, 83.9, 30.0]   # 2つ目の隙間 11.95 (51.95 + 11.95 = 63.9)
    expected_violations: 2