rule_id: AC.R1

layers:
  AC: { number: 3, datatype: 4 }
  AN: { number: 3, datatype: 2 }
  WN: { number: 140, datatype: 0 } # これが内部でWCとして処理される

allow_other_rules: false
waive_rule_ids:
  - AC.W1
  - AC.S1
  - AC.AN
  - AC.GC
  - AN.W1
  - AN.S1
  - WN.W1
  - WN.S1
  - WN.Z1
  - WN.Z2
  - WN.AN
  - Warning

cases:
  # ==========================================
  # 正常系：ANがドーナツ型（リング）となり、その穴の中にACがすっぽり収まる
  # ==========================================
  - name: pass_ac_surrounded_by_an_ring
    shapes:
      WN: [[-30.0, -30.0, 30.0, 30.0]] # 一番外側
      # ANをドーナツ型（ガードリング）にする
      AN:
        - type: donut
          outer: [-25.0, -25.0, 25.0, 25.0]
          inner: [-20.0, -20.0, 20.0, 20.0]
      # ACはANの穴（inner）の中に完全に収まるサイズにする
      AC: [[-15.0, -15.0, 15.0, 15.0]]
    expected_violations: 0

  # ==========================================
  # 異常系：ANがただの四角形（穴がない）場合 -> 違反数: 1
  # ==========================================
  - name: fail_an_solid_box
    shapes:
      WN: [[-30.0, -30.0, 30.0, 30.0]]
      # 穴がないただの四角形（これまでの失敗パターン）
      AN: [[-25.0, -25.0, 25.0, 25.0]] 
      AC: [[-15.0, -15.0, 15.0, 15.0]]
    expected_violations: 1