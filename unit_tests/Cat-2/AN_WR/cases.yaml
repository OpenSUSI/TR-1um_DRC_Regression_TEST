rule_id: AN.WR

layers:
  AN: { number: 3, datatype: 2 }
  WN: { number: 140, datatype: 0 }
  AR: { number: 3, datatype: 3 } # WNと重ねてWN(R)として認識させるためのレイヤー

allow_other_rules: false
waive_rule_ids:
  # AN, WN, AR の単体ルールや、前回テストしたAR.WRなどの不要なエラーをすべて無視
  - AN.W1
  - AN.S1
  - AN.XY
  - AN.L1
  - AN.WN
  - WN.W1
  - WN.S1
  - WN.S2
  - WN.Z1
  - WN.Z2
  - WN.Z3
  - WN.AN
  - AR.W1
  - AR.S1
  - AR.XY
  - AR.L1
  - AR.WR # これを入れないとARとWNのエンクロージャー違反が起きてしまう
  - GC.R1 # 念のため

cases:
  # パターン1：基準寸法 5.0 を満たすエンクロージャー（PASS）
  - name: pass_enclose_5p0
    shapes:
      WN:
        - [0.0, 0.0, 30.0, 30.0]   # 外側の大きな WN
      AR:
        - [0.0, 0.0, 30.0, 30.0]   # WNと全く同じサイズでARを敷き、全体を WN(R) にする
      AN:
        - [5.0, 5.0, 25.0, 25.0]   # 全辺からぴったり 5.0 内側に配置
    expected_violations: 0

  # パターン2：左側の1辺だけ囲みが 4.95 しかないエラー (違反数: 1)
  - name: fail_enclose_4p95_single
    shapes:
      WN:
        - [0.0, 0.0, 30.0, 30.0]
      AR:
        - [0.0, 0.0, 30.0, 30.0]
      AN:
        - [4.95, 5.0, 25.0, 25.0]  # 左辺だけ WN(0.0) から 4.95 の距離
    expected_violations: 1

  # パターン3：全辺で囲みが 4.95 しかないエラー
  - name: fail_enclose_4p95_all
    shapes:
      WN:
        - [0.05, 0.05, 29.95, 29.95] # WNとARを全体的に 0.05 小さくする
      AR:
        - [0.05, 0.05, 29.95, 29.95]
      AN:
        - [5.0, 5.0, 25.0, 25.0]     # ANからWNの端まで上下左右すべて 4.95 になる
    # ※前回同様、ツールの仕様によって1か4になります。エラーが出たらログに合わせて修正してください。
    expected_violations: 4