rule_id: AN.WR

layers:
  AN: { number: 3, datatype: 2 }
  WN: { number: 140, datatype: 0 }
  AR: { number: 3, datatype: 3 } # WN(R)判定用

allow_other_rules: false
waive_rule_ids:
  - AN.W1
  - AN.S1
  - AN.XY
  - AN.L1
  - AN.WN
  - WN.W1
  - WN.S1
  - WN.S2
  - WN.S7
  - WN.Z1
  - WN.Z2
  - WN.Z3
  - WN.AN
  - AR.W1
  - AR.S1
  - AR.XY
  - AR.L1
  - AR.WR
  - GC.R1
  - AR.AN
  - AR.GC
  - RR.SZ

cases:
  # ==========================================
  # 正常系：基準寸法 10.0 を満たすエンクロージャー (PASS)
  # ==========================================
  - name: pass_enclose_10p0
    shapes:
      WN:
        - [0.0, 0.0, 40.0, 40.0]
      AR:
        - [0.0, 0.0, 40.0, 40.0]
      AN:
        - [10.0, 10.0, 30.0, 30.0]
    expected_violations: 0

  # ==========================================
  # 異常系：左側の1辺だけ囲みが 9.95 (FAIL) -> 違反数: 1
  # ==========================================
  - name: fail_enclose_9p95_single
    shapes:
      WN:
        - [0.0, 0.0, 40.0, 40.0]
      AR:
        - [0.0, 0.0, 40.0, 40.0]
      AN:
        - [9.95, 10.0, 30.0, 30.0]
    expected_violations: 1

  # ==========================================
  # 異常系：全辺で囲みが 9.95 (FAIL) -> 違反数: 4
  # ==========================================
  - name: fail_enclose_9p95_all
    shapes:
      WN:
        - [0.05, 0.05, 39.95, 39.95]
      AR:
        - [0.05, 0.05, 39.95, 39.95]
      AN:
        - [10.0, 10.0, 30.0, 30.0]
    expected_violations: 4