rule_id: AC.AN

layers:
  AC: { number: 3, datatype: 4 }
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  - AC.W1
  - AC.S1
  - AC.R1
  - AC.GC
  - AN.W1
  - AN.S1
  - Warning

cases:
  # ==========================================
  # 正常系：ACの全周（上下左右）でANとの隙間がぴったり 2.80 (PASS)
  # ==========================================
  - name: pass_space_2p80
    shapes:
      AC:
        - [0.0, 0.0, 30.0, 30.0]
      AN:
        - type: donut
          outer: [-10.0, -10.0, 40.0, 40.0]
          inner: [-2.80, -2.80, 32.80, 32.80] # 全周の隙間: 2.80
    expected_violations: 0

  # ==========================================
  # 異常系：右辺の隙間だけ 2.75 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_2p75_single
    shapes:
      AC:
        - [0.0, 0.0, 30.0, 30.0]
      AN:
        - type: donut
          outer: [-10.0, -10.0, 40.0, 40.0]
          inner: [-2.80, -2.80, 32.75, 32.80] # 右辺の隙間: 32.75 - 30.0 = 2.75
    expected_violations: 1

  # ==========================================
  # 異常系：左右2辺の隙間が 2.75 (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_2p75_double
    shapes:
      AC:
        - [0.0, 0.0, 30.0, 30.0]
      AN:
        - type: donut
          outer: [-10.0, -10.0, 40.0, 40.0]
          inner: [-2.75, -2.80, 32.75, 32.80] # 左右の隙間: 各2.75
    expected_violations: 2