rule_id: WN.N1

layers:
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  # ノッチ検証に無関係な幅・スペース・Z系ルールを無視
  - WN.W1
  - WN.S1
  - WN.S7

cases:
  # ==========================================
  # 正常系：ノッチ幅がぴったり 7.00 (PASS)
  # ==========================================
  - name: pass_notch_7p0
    shapes:
      WN:
        - [0.0, 0.0, 30.0, 20.0]   # 下部の土台
        - [0.0, 20.0, 10.0, 50.0]  # 左の柱
        - [17.0, 20.0, 27.0, 50.0] # 右の柱（隙間: 17.0 - 10.0 = 7.0）
    expected_violations: 0

  # ==========================================
  # 異常系：ノッチ幅が 6.95 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_notch_6p95_single
    shapes:
      WN:
        - [0.0, 0.0, 30.0, 20.0]
        - [0.0, 20.0, 10.0, 50.0]
        - [16.95, 20.0, 26.95, 50.0] # 隙間: 16.95 - 10.0 = 6.95
    expected_violations: 1

  # ==========================================
  # 異常系：ノッチ幅が 6.95 の箇所が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_notch_6p95_double
    shapes:
      WN:
        - [0.0, 0.0, 60.0, 20.0]     # 幅広の土台
        - [0.0, 20.0, 10.0, 50.0]
        - [16.95, 20.0, 26.95, 50.0] # 1つ目のノッチ（隙間 6.95）
        - [43.90, 20.0, 53.90, 50.0] # 2つ目のノッチ（隙間: 43.90 - 36.95 = 6.95）
        - [26.95, 20.0, 36.95, 50.0] # 中央の柱
    expected_violations: 2