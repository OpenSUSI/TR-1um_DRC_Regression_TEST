rule_id: WN.S4

layers:
  WN: { number: 140, datatype: 0 }
  AR: { number: 3, datatype: 3 } # WN(R)生成用
  AC: { number: 3, datatype: 4 } # WN(C)生成用

allow_other_rules: false
waive_rule_ids:
  # 他のスペースルールや単体ルール、これまでのテストで判明したエラーをすべて無視
  - WN.S1
  - WN.S2
  - WN.S3
  - WN.W1
  - WN.Z1
  - WN.Z2
  - WN.Z3
  - AR.W1
  - AR.S1
  - AR.XY
  - AR.L1
  - AR.WR
  - AC.W1
  - AC.S1
  - AC.XY
  - AC.L1
  - AC.R1
  - GC.R1 # 念のため追加

cases:
  # パターン1：基準寸法 9.5 を満たすスペース（PASS）
  - name: pass_space_9p5
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]  # 左側 (WN(R)用)
        - [29.5, 0.0, 49.5, 30.0] # 右側 (WN(C)用) / 隙間 9.5
      AR:
        - [0.0, 0.0, 20.0, 30.0]  # 左側を WN(R) にする
      AC:
        - [29.5, 0.0, 49.5, 30.0] # 右側を WN(C) にする
    expected_violations: 0

  # パターン2：隙間が 9.45 しかないエラー (違反数: 1)
  - name: fail_space_9p45_single
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [29.45, 0.0, 49.45, 30.0] # 隙間 9.45
      AR:
        - [0.0, 0.0, 20.0, 30.0]
      AC:
        - [29.45, 0.0, 49.45, 30.0]
    expected_violations: 1

  # パターン3：隙間 9.45 のエラーが2箇所 (違反数: 2)
  - name: fail_space_9p45_double
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]      # 1つ目: WN(R)用
        - [29.45, 0.0, 49.45, 30.0]   # 2つ目: WN(C)用 (隙間 9.45)
        - [58.9, 0.0, 78.9, 30.0]     # 3つ目: WN(R)用 (中央から隙間 9.45)
      AR:
        - [0.0, 0.0, 20.0, 30.0]      # 1つ目を WN(R) に
        - [58.9, 0.0, 78.9, 30.0]     # 3つ目を WN(R) に
      AC:
        - [29.45, 0.0, 49.45, 30.0]   # 中央を WN(C) に
    expected_violations: 2