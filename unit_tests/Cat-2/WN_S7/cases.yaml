rule_id: WN.S7

layers:
  WN: { number: 140, datatype: 0 }
  AP: { number: 3, datatype: 1 } # WN(M)生成用

allow_other_rules: false
waive_rule_ids:
  # WN, AP, DP関連の連鎖エラーを無視
  - WN.W1
  - WN.S1
  - WN.AP
  - AP.W1
  - AP.S1
  - AP.WN
  - DP.W1
  - DP.S1
  - DP.AP

cases:
  # ==========================================
  # 正常系：間隔が 12.00 (PASS)
  # ==========================================
  - name: pass_space_12p0
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [32.0, 0.0, 52.0, 30.0] # 20.0 + 12.0 = 32.0
      AP:
        - [0.0, 0.0, 20.0, 30.0]
        - [32.0, 0.0, 52.0, 30.0]
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が 11.95 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_11p95_single
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [31.95, 0.0, 51.95, 30.0] # 20.0 + 11.95 = 31.95
      AP:
        - [0.0, 0.0, 20.0, 30.0]
        - [31.95, 0.0, 51.95, 30.0]
    expected_violations: 1

  # ==========================================
  # 異常系：間隔が 11.95 の箇所が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_11p95_double
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [31.95, 0.0, 51.95, 30.0]
        - [63.90, 0.0, 83.90, 30.0] # 51.95 + 11.95 = 63.90
      AP:
        - [0.0, 0.0, 20.0, 30.0]
        - [31.95, 0.0, 51.95, 30.0]
        - [63.90, 0.0, 83.90, 30.0]
    expected_violations: 2