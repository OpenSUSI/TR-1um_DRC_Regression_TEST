rule_id: WN.S2

layers:
  WN: { number: 140, datatype: 0 }
  AR: { number: 3, datatype: 3 } # WNをWN(R)として認識させるためのレイヤー

allow_other_rules: false
waive_rule_ids:
  # WNとWN(R)の距離が12.0未満になるため、通常のWN間隔エラー(WN.S1)を必ず無視する
  - WN.S1
  - WN.W1
  - WN.Z1
  - WN.Z3
  - AR.W1
  - AR.S1
  - AR.XY
  - AR.L1
  - AR.WR
  - AR.GC
  - RR.SZ
  - GC.R1
  

cases:
  # パターン1：基準寸法 9.5 を満たすスペース（PASS）
  - name: pass_space_9p5
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]  # 通常の WN
        - [29.5, 0.0, 49.5, 30.0] # WN(R) になる WN (隙間 9.5)
      AR:
        - [29.5, 0.0, 49.5, 30.0] # ARを重ねることで、右側のWNが「WN(R)」として認識される
    expected_violations: 0

  # パターン2：隙間が 9.45 しかないエラー (違反数: 1)
  - name: fail_space_9p45_single
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [29.45, 0.0, 49.45, 30.0] # 隙間 9.45
      AR:
        - [29.45, 0.0, 49.45, 30.0] # 右側を WN(R) にする
    expected_violations: 1

  # パターン3：隙間 9.45 のエラーが2箇所 (違反数: 2)
  - name: fail_space_9p45_double
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]      # 1つ目: 通常の WN
        - [29.45, 0.0, 49.45, 30.0]   # 2つ目: WN(R) になる WN
        - [58.9, 0.0, 78.9, 30.0]     # 3つ目: 通常の WN (中央から 9.45 離す)
      AR:
        - [29.45, 0.0, 49.45, 30.0]   # 中央のWNだけを WN(R) にする
    expected_violations: 2