rule_id: AC.S1

layers:
  AC: { number: 3, datatype: 4 }

allow_other_rules: false
# スペースチェックに無関係なACの単体エラーを無視
waive_rule_ids:
  - AC.W1
  - AC.R1

cases:
  # ==========================================
  # 正常系：間隔がぴったり 6.4 (PASS)
  # ==========================================
  - name: pass_space_6p4
    shapes:
      AC: 
        # 1つ目の図形
        - [0.0, 0.0, 10.0, 10.0]
        # 2つ目の図形 (10.0 + 6.4 = 16.4 から配置)
        - [16.4, 0.0, 26.4, 10.0] 
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が 6.35 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_space_6p35_single
    shapes:
      AC: 
        - [0.0, 0.0, 10.0, 10.0]
        # 隙間を6.35にする (10.0 + 6.35 = 16.35)
        - [16.35, 0.0, 26.35, 10.0] 
    expected_violations: 1

  # ==========================================
  # 異常系：間隔が 6.35 の箇所が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_space_6p35_double
    shapes:
      AC: 
        # 中央の図形
        - [10.0, 0.0, 20.0, 10.0]
        # 左側の図形 (10.0 から左に 6.35 離す -> X最大値 3.65)
        - [-6.35, 0.0, 3.65, 10.0] 
        # 右側の図形 (20.0 から右に 6.35 離す -> X最小値 26.35)
        - [26.35, 0.0, 36.35, 10.0] 
    expected_violations: 2