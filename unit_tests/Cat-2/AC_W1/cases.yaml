rule_id: AC.W1

layers:
  AC: { number: 3, datatype: 4 }

allow_other_rules: false
# 幅チェックに無関係なエラー(スペースや構造)を無視
waive_rule_ids:
  - AC.S1
  - AC.R1
  - AC.AN
  - AC.GC
  - Warning

cases:
  # ==========================================
  # 【Wminテスト】正常系：幅が 28.5以上 (PASS)
  # ==========================================
  - name: pass_width_30p0
    shapes:
      AC: 
        # 幅30.0, 長さ100.0 (Wmin:28.5 ≦ 幅 ≦ Wmax:120.0)
        - [0.0, 0.0, 30.0, 100.0]
    expected_violations: 0

  # ==========================================
  # 【Wminテスト】異常系：幅が 28.45 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_width_28p45_single
    shapes:
      AC: 
        # 幅を28.45に縮める (短辺 ＜ Wmin ≦ 長辺)
        - [0.0, 0.0, 28.45, 100.0]
    expected_violations: 1

  # ==========================================
  # 【Wminテスト】異常系：幅が 28.45 の図形が2つ (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_width_28p45_double
    shapes:
      AC: 
        - [0.0, 0.0, 28.45, 100.0]
        - [50.0, 0.0, 78.45, 100.0]
    expected_violations: 2

  # ==========================================
  # 【Wmaxテスト】正常系：長辺だけがWmaxを超えている配線 (PASS)
  # ==========================================
  - name: pass_wmax_120p0_length_200p0
    shapes:
      AC: 
        # 短辺を 120.0 (Wmaxぴったり)、長辺を 200.0 にする
        # Wmin ≦ 短辺 ≦ Wmax ＜ 長辺 なので「合法な配線」としてエラー0になる
        - [0.0, 0.0, 120.0, 200.0]
    expected_violations: 0

  # ==========================================
  # 【Wmaxテスト】異常系：短辺も長辺もWmaxを超えている (FAIL) -> 違反数: 4
  # ==========================================
  - name: fail_wmax_120p05_block
    shapes:
      AC: 
        # 短辺を 120.05 にする (長辺は200.0)
        # Wmax ＜ 短辺 となり「巨大なブロック」と判定されるため、4辺すべてでエラー発生
        - [0.0, 0.0, 120.05, 200.0]
    expected_violations: 4