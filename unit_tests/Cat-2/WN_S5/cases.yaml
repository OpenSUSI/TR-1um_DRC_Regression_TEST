rule_id: WN.S5

layers:
  WN: { number: 140, datatype: 0 }
  AR: { number: 3, datatype: 3 } # WNをWN(R)として認識させるためのレイヤー

allow_other_rules: false
waive_rule_ids:
  # WNやARの単体ルール、および派生レイヤーによる他のスペースエラーをすべて無視
  - WN.S1
  - WN.S2
  - WN.W1
  - WN.Z1
  - WN.Z3
  - AR.W1
  - AR.S1
  - AR.XY
  - AR.L1
  - AR.WR
  - AR.GC
  - RR.SZ
  - GC.R1

cases:
  # パターン1：基準寸法 8.0 を満たすスペース（PASS）
  - name: pass_space_8p0
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]  # 左側 WN
        - [28.0, 0.0, 48.0, 30.0] # 右側 WN (隙間 8.0)
      AR:
        - [0.0, 0.0, 20.0, 30.0]  # 左側を WN(R) に
        - [28.0, 0.0, 48.0, 30.0] # 右側を WN(R) に
    expected_violations: 0

  # パターン2：隙間が 7.95 しかないエラー (違反数: 1)
  - name: fail_space_7p95_single
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [27.95, 0.0, 47.95, 30.0] # 隙間 7.95
      AR:
        - [0.0, 0.0, 20.0, 30.0]
        - [27.95, 0.0, 47.95, 30.0]
    expected_violations: 1

  # パターン3：隙間 7.95 のエラーが2箇所 (違反数: 2)
  - name: fail_space_7p95_double
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]      # 1つ目
        - [27.95, 0.0, 47.95, 30.0]   # 2つ目 (隙間 7.95)
        - [55.9, 0.0, 75.9, 30.0]     # 3つ目 (隙間 7.95)
      AR:
        - [0.0, 0.0, 20.0, 30.0]
        - [27.95, 0.0, 47.95, 30.0]
        - [55.9, 0.0, 75.9, 30.0]
    expected_violations: 2