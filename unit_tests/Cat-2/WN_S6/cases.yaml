rule_id: WN.S6

layers:
  WN: { number: 140, datatype: 0 }
  AC: { number: 3, datatype: 4 } # WNをWN(C)として認識させるためのレイヤー

allow_other_rules: false
waive_rule_ids:
  # WNやACの単体ルール、および派生レイヤーによる他のスペースエラーをすべて無視
  - WN.S1
  - WN.S2
  - WN.S3
  - WN.S4
  - WN.S5
  - WN.W1
  - WN.Z1
  - WN.Z2
  - WN.Z3
  - AC.W1
  - AC.S1
  - AC.XY
  - AC.L1
  - AC.R1
  - GC.R1 # 念のため追加

cases:
  # パターン1：基準寸法 12.0 を満たすスペース（PASS）
  - name: pass_space_12p0
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]  # 左側 WN
        - [32.0, 0.0, 52.0, 30.0] # 右側 WN (隙間 12.0)
      AC:
        - [0.0, 0.0, 20.0, 30.0]  # 左側を WN(C) に
        - [32.0, 0.0, 52.0, 30.0] # 右側を WN(C) に
    expected_violations: 0

  # パターン2：隙間が 11.95 しかないエラー (違反数: 1)
  - name: fail_space_11p95_single
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]
        - [31.95, 0.0, 51.95, 30.0] # 隙間 11.95
      AC:
        - [0.0, 0.0, 20.0, 30.0]
        - [31.95, 0.0, 51.95, 30.0]
    expected_violations: 1

  # パターン3：隙間 11.95 のエラーが2箇所 (違反数: 2)
  - name: fail_space_11p95_double
    shapes:
      WN:
        - [0.0, 0.0, 20.0, 30.0]      # 1つ目
        - [31.95, 0.0, 51.95, 30.0]   # 2つ目 (隙間 11.95)
        - [63.9, 0.0, 83.9, 30.0]     # 3つ目 (隙間 11.95)
      AC:
        - [0.0, 0.0, 20.0, 30.0]
        - [31.95, 0.0, 51.95, 30.0]
        - [63.9, 0.0, 83.9, 30.0]
    expected_violations: 2