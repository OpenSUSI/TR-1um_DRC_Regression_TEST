rule_id: AC.WC

layers:
  AC: { number: 3, datatype: 4 }
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
# 構造チェックに専念するため、ACやWNの単体/構造エラーを無視
waive_rule_ids:
  - AC.W1
  - AC.S1
  - AC.R1  # ACがANに囲まれていないというエラーを無視
  - WN.W1
  - WN.S1
  - WN.Z1
  - WN.Z2

cases:
  # ==========================================
  # 正常系：WNがACを全方向から 8.0 で囲んでいる (PASS)
  # ==========================================
  - name: pass_enclose_8p0
    shapes:
      WN: # ACの座標から上下左右にちょうど 8.0 ずつ広げたサイズ
        - [-8.0, -8.0, 18.0, 18.0]
      AC:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 0

  # ==========================================
  # 異常系：左側だけ囲みが 7.95 (0.05不足) -> 違反数: 1
  # ==========================================
  - name: fail_enclose_7p95_single
    shapes:
      WN: # 左辺(-8.0)を右に0.05削って -7.95 にする
        - [-7.95, -8.0, 18.0, 18.0]
      AC:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 1

  # ==========================================
  # 異常系：左右の2箇所の囲みが 7.95 (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_enclose_7p95_double
    shapes:
      WN: # 左辺(-7.95)と右辺(17.95)をそれぞれ削る
        - [-7.95, -8.0, 17.95, 18.0]
      AC:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 2