rule_id: ANE.LM

layers:
  GC: { number: 8, datatype: 1 }
  AN: { number: 3, datatype: 2 } # NMOSのアクティブ層
  ESD: { number: 63, datatype: 2 } # ESDマーカー

allow_other_rules: false
waive_rule_ids:
  # ESD/ANに関連する連鎖ルールや単体サイズエラーをWaive
  - ANE.WM
  - ANE.AP
  - ANE.XY
  - ANE.CO
  - GC.W1
  - GC.S1
  - AN.W1
  - AN.S1
  - AN.XY
  - AN.WM
  - AN.LM

cases:
  # ==========================================
  # 正常系：ゲート長 2.0 <= L <= 30.0 -> PASS
  # ==========================================
  - name: pass_length_5p0
    shapes:
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AN:
        - [0.0, 0.0, 50.0, 50.0]
      GC:
        - [10.0, -10.0, 15.0, 60.0] # ゲート長=5.0 (2.0 < 5.0 < 30.0)
    expected_violations: 0

  # ==========================================
  # 異常系①：Lmin違反 (L < 2.0) -> FAIL
  # ==========================================
  - name: fail_lmin_1p95
    shapes:
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AN:
        - [0.0, 0.0, 50.0, 50.0]
      GC:
        - [10.0, -10.0, 11.95, 60.0] # ゲート長=1.95 (< 2.0)
    # 上下2箇所で発火
    expected_violations: 2

  # ==========================================
  # 異常系②：Lmax違反 (L > 30.0) -> FAIL
  # ==========================================
  - name: fail_lmax_30p05
    shapes:
      ESD:
        - [-50.0, -50.0, 200.0, 200.0]
      AN:
        - [0.0, 0.0, 100.0, 100.0]
      GC:
        - [10.0, -10.0, 40.05, 110.0] # ゲート長=30.05 (> 30.0)
    # 上下2箇所で発火
    expected_violations: 2