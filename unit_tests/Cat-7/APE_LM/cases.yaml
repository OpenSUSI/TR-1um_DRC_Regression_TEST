rule_id: APE.LM

layers:
  GC: { number: 8, datatype: 1 }
  AP: { number: 3, datatype: 1 }
  AN: { number: 3, datatype: 2 } # MNE生成に必要
  WN: { number: 140, datatype: 0 }
  ESD: { number: 63, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  - APE.WM
  - APE.AN
  - APE.XY
  - APE.CO
  - GC.W1
  - GC.S1
  - AP.W1
  - AP.S1
  - AP.XY
  - AP.WM
  - AN.W1
  - AN.S1
  - WN.W1
  - WN.S1
  - WN.AP
  - WN.AN

cases:
  # ==========================================
  # 正常系：ゲート長 2.0 <= L <= 30.0 -> PASS
  # ==========================================
  - name: pass_length_5p0
    shapes:
      WN:
        - [-20.0, -20.0, 100.0, 100.0]
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AP:
        - [0.0, 0.0, 50.0, 50.0]
      GC:
        - [10.0, 0.0, 15.0, 50.0] # ゲート長=5.0 (2.0 < 5.0 < 30.0)
    expected_violations: 0

  # ==========================================
  # 異常系①：Lmin違反 (L < 2.0) -> FAIL
  # ==========================================
  - name: fail_lmin_1p95
    shapes:
      WN:
        - [-20.0, -20.0, 100.0, 100.0]
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AP:
        - [0.0, 0.0, 50.0, 50.0]
      GC:
        - [10.0, 0.0, 11.95, 50.0] # ゲート長=1.95 (< 2.0)
    # 上下2箇所で発火
    expected_violations: 2

  # ==========================================
  # 異常系②：Lmax違反 (L > 30.0) -> FAIL
  # ==========================================
  - name: fail_lmax_30p05
    shapes:
      WN:
        - [-50.0, -50.0, 200.0, 200.0]
      ESD:
        - [-50.0, -50.0, 200.0, 200.0]
      AP:
        - [0.0, 0.0, 100.0, 100.0]
      GC:
        - [10.0, 0.0, 40.05, 100.0] # ゲート長=30.05 (> 30.0)
    # 上下2箇所で発火
    expected_violations: 2