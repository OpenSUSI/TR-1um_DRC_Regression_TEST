rule_id: COE.W1

layers:
  GC: { number: 8, datatype: 1 }
  AP: { number: 3, datatype: 1 }
  WN: { number: 140, datatype: 0 }
  ESD: { number: 63, datatype: 2 }
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - COE.S1
  - COE.AP
  - COE.AN
  - CDE.GC
  - CSE.GC
  - APE.WM
  - APE.LM
  - APE.AN
  - APE.XY
  - APE.CO
  - AP.W1
  - AP.S1
  - AP.XY
  - AP.WM
  - GC.W1
  - GC.S1
  - WN.W1
  - WN.S1
  - WN.AP
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - CO.AP

cases:
  # ==========================================
  # 正常系：COのサイズを 3.0 x 3.0 にする -> PASS
  # ==========================================
  - name: pass_width_3p0
    shapes:
      WN:
        - [-20.0, -20.0, 100.0, 100.0]
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AP:
        - [0.0, 0.0, 20.0, 20.0]
      GC:
        - [-5.0, -5.0, 25.0, 25.0]
      CO:
        # 0.0から3.0のピッタリ3.0サイズ
        - [0.0, 0.0, 3.0, 3.0] 
    expected_violations: 0

  # ==========================================
  # 異常系①：幅を 2.95 に縮める (W != 3.0) -> FAIL
  # ==========================================
  - name: fail_width_2p95
    shapes:
      WN:
        - [-20.0, -20.0, 100.0, 100.0]
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AP:
        - [0.0, 0.0, 20.0, 20.0]
      GC:
        - [-5.0, -5.0, 25.0, 25.0]
      CO:
        # 0.0から2.95のサイズ（0.05グリッドに乗っている）
        - [0.0, 0.0, 2.95, 2.95] 
    expected_violations: 4

  # ==========================================
  # 異常系②：幅を 3.05 に広げる (W != 3.0) -> FAIL
  # ==========================================
  - name: fail_width_3p05
    shapes:
      WN:
        - [-20.0, -20.0, 100.0, 100.0]
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AP:
        - [0.0, 0.0, 20.0, 20.0]
      GC:
        - [-5.0, -5.0, 25.0, 25.0]
      CO:
        # 0.0から3.05のサイズ（0.05グリッドに乗っている）
        - [0.0, 0.0, 3.05, 3.05] 
    expected_violations: 4