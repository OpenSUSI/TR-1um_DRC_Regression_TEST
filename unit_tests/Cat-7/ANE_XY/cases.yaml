rule_id: ANE.XY

layers:
  GC: { number: 8, datatype: 1 }
  AN: { number: 3, datatype: 2 }
  ESD: { number: 63, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  # MNEに関連する寸法ルールや、構成レイヤーの単体エラーを無視
  - ANE.WM
  - ANE.LM
  - ANE.AP
  - ANE.CO
  - AN.W1
  - AN.S1
  - AN.WM
  - GC.W1
  - GC.S1

cases:
  # ==========================================
  # 正常系：8辺あり、カット面積が十分にある八角形 -> PASS
  # cut: 1.5 の場合、角の三角形の面積は (1.5 * 1.5) / 2 = 1.125 (>= 0.98)
  # ==========================================
  - name: pass_octagon
    shapes:
      ESD:
        - [-10.0, -10.0, 20.0, 20.0]
      GC:
        # ANを完全に覆い、交差部分(MNE)をANの形そのままにする
        - [-5.0, -5.0, 15.0, 15.0]
      AN:
        - type: octagon
          box: [0.0, 0.0, 10.0, 10.0]
          cut: 1.5
    expected_violations: 0

  # ==========================================
  # 異常系①：八角形ではない（四角形/4辺） -> 違反数: 4
  # 四隅すべてがカットされていないため、4箇所のコーナーでそれぞれエラーになる
  # ==========================================
  - name: fail_rectangle
    shapes:
      ESD:
        - [-10.0, -10.0, 20.0, 20.0]
      GC:
        - [-5.0, -5.0, 15.0, 15.0]
      AN:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 4

  # ==========================================
  # 異常系②：カット面積不足 (cut: 1.0) -> 違反数: 4
  # cut: 1.0 の場合、角の三角形の面積は (1.0 * 1.0) / 2 = 0.50 (< 0.98)
  # ==========================================
  - name: fail_small_cut
    shapes:
      ESD:
        - [-10.0, -10.0, 20.0, 20.0]
      GC:
        - [-5.0, -5.0, 15.0, 15.0]
      AN:
        - type: octagon
          box: [0.0, 0.0, 10.0, 10.0]
          cut: 1.0
    expected_violations: 4