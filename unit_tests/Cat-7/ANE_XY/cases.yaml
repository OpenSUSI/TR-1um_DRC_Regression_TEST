rule_id: ANE.XY

layers:
  ESD: { number: 63, datatype: 2 }
  AN:  { number:  3, datatype: 2 }
  GC:  { number:  8, datatype: 1 }

allow_other_rules: false
waive_rule_ids:
  - ANE.WM
  - ANE.LM
  - ANE.AP
  - ANE.CO
  - AN.W1
  - AN.S1
  - AN.XY
  - AN.WM
  - AN.LM
  - GC.W1
  - GC.S1
  - GC.ANT
  - GA.CO
  - Warning

cases:
  # ==========================================
  # 正常系：カット量 1.40 (PASS)
  # ==========================================
  - name: pass_bevel_1p40
    shapes:
      ESD:
        - [-10.0, -10.0, 20.0, 20.0]
      GC:
        - [-5.0, -5.0, 15.0, 15.0]
      AN:
        - type: octagon
          box: [0.0, 0.0, 10.0, 10.0]
          cut: 1.40
    expected_violations: 0

  # ==========================================
  # 異常系①：四角形 -> 4コーナー違反 (違反数: 4)
  # ==========================================
  - name: fail_rectangle
    shapes:
      ESD:
        - [-10.0, -10.0, 20.0, 20.0]
      GC:
        - [-5.0, -5.0, 15.0, 15.0]
      AN:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 4

  # ==========================================
  # 異常系②：カット量 1.35 (0.05不足) -> 4コーナー違反 (違反数: 4)
  # ==========================================
  - name: fail_bevel_1p35
    shapes:
      ESD:
        - [-10.0, -10.0, 20.0, 20.0]
      GC:
        - [-5.0, -5.0, 15.0, 15.0]
      AN:
        - type: octagon
          box: [0.0, 0.0, 10.0, 10.0]
          cut: 1.35
    expected_violations: 4