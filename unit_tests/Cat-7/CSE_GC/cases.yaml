rule_id: CSE.GC

layers:
  GC: { number: 8, datatype: 1 }
  AN: { number: 3, datatype: 2 } # トランジスタ用 (MNE)
  AP: { number: 3, datatype: 1 } # Bulkコンタクト用 (GN)
  ESD: { number: 63, datatype: 2 }
  CO: { number: 11, datatype: 0 }
  M1: { number: 13, datatype: 0 } # ソースとBulkを繋ぐ配線

allow_other_rules: false
waive_rule_ids:
  - CDE.GC
  - COE.W1
  - COE.S1
  - COE.AP
  - COE.AN
  - ANE.WM
  - ANE.LM
  - ANE.AP
  - ANE.XY
  - ANE.CO
  - AP.W1
  - AP.S1
  - AP.XY
  - AN.W1
  - AN.S1
  - AN.XY
  - GC.W1
  - GC.S1
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - M1.W1
  - M1.S1
  - M1.CO
  - M1.CL

cases:
  # ==========================================
  # 正常系：ソースCOとGCの間隔を 3.5 にする (Smin=3.0) -> PASS
  # ==========================================
  - name: pass_space_3p5
    shapes:
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AP: # Bulk (GN) 用のアクティブ領域
        - [-20.0, 0.0, -5.0, 20.0]
      AN: # トランジスタ (MNE) 用のアクティブ領域
        - [0.0, 0.0, 50.0, 20.0]
      GC:
        - [20.0, -5.0, 25.0, 25.0]
      CO:
        - [-15.0, 8.5, -12.0, 11.5] # Bulkコンタクト (GN上)
        - [13.5, 8.5, 16.5, 11.5]   # ソースコンタクト (GC=20.0から3.5離す)
        - [32.5, 8.5, 35.5, 11.5]   # ドレインコンタクト (念のため右側に配置)
      M1:
        # Bulkコンタクトとソースコンタクトを繋ぐ配線 (これでCOSとして認識される)
        - [-15.0, 8.5, 16.5, 11.5]
    expected_violations: 0

  # ==========================================
  # 異常系：ソースCOとGCの間隔を 2.95 に縮める (< 3.0) -> FAIL
  # ==========================================
  - name: fail_space_2p95_single
    shapes:
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AP:
        - [-20.0, 0.0, -5.0, 20.0]
      AN:
        - [0.0, 0.0, 50.0, 20.0]
      GC:
        - [20.0, -5.0, 25.0, 25.0]
      CO:
        - [-15.0, 8.5, -12.0, 11.5] # Bulkコンタクト
        - [14.05, 8.5, 17.05, 11.5] # ソースコンタクト (GC=20.0から2.95離す)
        - [32.5, 8.5, 35.5, 11.5]   # ドレインコンタクト
      M1:
        # Bulkとソースの接続配線
        - [-15.0, 8.5, 17.05, 11.5]
    expected_violations: 1