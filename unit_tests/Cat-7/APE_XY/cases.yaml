rule_id: APE.XY

layers:
  ESD: { number:  63, datatype: 2 }
  WN:  { number: 140, datatype: 0 }
  AP:  { number:   3, datatype: 1 }
  GC:  { number:   8, datatype: 1 }

allow_other_rules: false
waive_rule_ids:
  - APE.WM
  - APE.LM
  - APE.AN
  - APE.CO
  - AP.W1
  - AP.S1
  - AP.XY
  - AP.WM
  - AP.LM
  - GC.W1
  - GC.S1
  - GC.ANT
  - GA.CO
  - WN.W1
  - WN.S1
  - WN.AP
  - Warning

cases:
  # ==========================================
  # 正常系：カット量 1.40 (PASS)
  # ==========================================
  - name: pass_bevel_1p40
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 20.0]
      ESD:
        - [-10.0, -10.0, 20.0, 20.0]
      GC:
        - [-5.0, -5.0, 15.0, 15.0]
      AP:
        - type: octagon
          box: [0.0, 0.0, 10.0, 10.0]
          cut: 1.40
    expected_violations: 0

  # ==========================================
  # 異常系①：四角形 -> 4コーナー違反 (違反数: 4)
  # ==========================================
  - name: fail_rectangle
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 20.0]
      ESD:
        - [-10.0, -10.0, 20.0, 20.0]
      GC:
        - [-5.0, -5.0, 15.0, 15.0]
      AP:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 4

  # ==========================================
  # 異常系②：カット量 1.35 (0.05不足) -> 4コーナー違反 (違反数: 4)
  # ==========================================
  - name: fail_bevel_1p35
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 20.0]
      ESD:
        - [-10.0, -10.0, 20.0, 20.0]
      GC:
        - [-5.0, -5.0, 15.0, 15.0]
      AP:
        - type: octagon
          box: [0.0, 0.0, 10.0, 10.0]
          cut: 1.35
    expected_violations: 4