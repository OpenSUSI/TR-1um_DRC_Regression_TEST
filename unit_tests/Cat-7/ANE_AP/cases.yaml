rule_id: ANE.AP

layers:
  GC: { number: 8, datatype: 1 }
  AP: { number: 3, datatype: 1 } # 比較対象のPMOSアクティブ層
  AN: { number: 3, datatype: 2 } # MNEとなるアクティブ層
  ESD: { number: 63, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  # MNE, AP, AN, GCに関連する単体エラーや別間隔ルールを無視
  - ANE.WM
  - ANE.LM
  - ANE.XY
  - AN.W1
  - AN.S1
  - AN.XY
  - AN.WM
  - AP.W1
  - AP.S1
  - AP.XY
  - AP.WM
  - GC.W1
  - GC.S1
  - WN.Z1 # APがWNに乗っていないことで出るエラーを想定してWaive

cases:
  # ==========================================
  # 正常系：MNEとAPの間隔を 10.5 にする (Smin=10.0) -> PASS
  # ==========================================
  - name: pass_space_10p5
    shapes:
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AN: # MNEとなるAN図形 (右端 X=20.0)
        - [0.0, 0.0, 20.0, 20.0]
      GC: # ANと交差させてMNEとして認識させる
        - [-5.0, 5.0, 25.0, 15.0]
      AP: # MNE(ANの右端X=20.0) から 10.5 離して配置
        - [30.5, 0.0, 50.5, 20.0]
    expected_violations: 0

  # ==========================================
  # 異常系：MNEとAPの間隔を 9.95 にする (< 10.0) -> FAIL
  # ==========================================
  - name: fail_space_9p95_single
    shapes:
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AN:
        - [0.0, 0.0, 20.0, 20.0]
      GC:
        - [-5.0, 5.0, 25.0, 15.0]
      AP: # MNE(ANの右端X=20.0) から 9.95 離して配置
        - [29.95, 0.0, 49.95, 20.0]
    expected_violations: 1