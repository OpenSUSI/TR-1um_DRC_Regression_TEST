rule_id: ANE.WM

layers:
  GC: { number: 8, datatype: 1 }
  AN: { number: 3, datatype: 2 } # NMOSのアクティブ層
  ESD: { number: 63, datatype: 2 } # ESDマーカー

allow_other_rules: false
waive_rule_ids:
  - ANE.LM
  - ANE.AP
  - ANE.XY
  - ANE.CO
  - GC.W1
  - GC.S1
  - AN.W1
  - AN.S1
  - AN.XY
  - AN.WM

cases:
  # ==========================================
  # 正常系：AN-GCの幅を 20.0 にする (11.0 <= W <= 60.0) -> PASS
  # ==========================================
  - name: pass_width_20p0
    shapes:
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AN:
        - [0.0, 0.0, 20.0, 70.0]
      GC:
        - [-5.0, 25.0, 25.0, 45.0]
    expected_violations: 0

  # ==========================================
  # 異常系①：最小幅違反。幅を 10.95 に縮める (< 11.0) -> FAIL
  # ==========================================
  - name: fail_wmin_10p95
    shapes:
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AN:
        - [0.0, 0.0, 10.95, 70.0]
      GC:
        - [-5.0, 25.0, 15.0, 45.0]
    expected_violations: 2

  # ==========================================
  # 異常系②：最大幅違反。幅を 60.05 に広げる (> 60.0) -> FAIL
  # ==========================================
  - name: fail_wmax_60p05
    shapes:
      ESD:
        - [-50.0, -50.0, 200.0, 200.0]
      AN:
        - [0.0, 0.0, 60.05, 150.0]
      GC:
        - [-5.0, 65.0, 65.0, 85.0]
    expected_violations: 2