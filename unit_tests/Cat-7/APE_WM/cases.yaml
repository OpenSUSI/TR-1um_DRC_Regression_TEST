rule_id: APE.WM

layers:
  GC: { number: 8, datatype: 1 }
  AP: { number: 3, datatype: 1 }
  WN: { number: 140, datatype: 0 } # PMOS判定用のN-Well
  ESD: { number: 63, datatype: 2 } # ESDマーカー

allow_other_rules: false
waive_rule_ids:
  # ESD/APに関連する連鎖ルールや単体サイズエラーをWaive
  - APE.LM
  - APE.AN
  - APE.XY
  - APE.CO
  - GC.W1
  - GC.S1
  - GC.AP
  - AP.W1
  - AP.S1
  - AP.XY
  - AP.WM
  - WN.W1
  - WN.S1
  - WN.AP

cases:
  # ==========================================
  # 正常系：AP-GCの幅を 20.0 にする (11.0 <= W <= 60.0) -> PASS
  # ==========================================
  - name: pass_width_20p0
    shapes:
      WN:
        - [-20.0, -20.0, 100.0, 100.0] # MPE化するための広大な下地
      ESD:
        - [-20.0, -20.0, 100.0, 100.0] # MPE化するための広大な下地
      AP:
        - [0.0, 0.0, 20.0, 70.0]       # X幅=20.0, Y長さ=70.0
      GC:
        - [-5.0, 25.0, 25.0, 45.0]
    expected_violations: 0

  # ==========================================
  # 異常系①：最小幅違反。幅を 10.95 に縮める (< 11.0) -> FAIL
  # ==========================================
  - name: fail_wmin_10p95
    shapes:
      WN:
        - [-20.0, -20.0, 100.0, 100.0]
      ESD:
        - [-20.0, -20.0, 100.0, 100.0]
      AP:
        - [0.0, 0.0, 10.95, 70.0]
      GC:
        - [-5.0, 25.0, 15.0, 45.0]
    # 上下のAP-GC(ソース/ドレイン)の2箇所で発火すると想定
    expected_violations: 2

  # ==========================================
  # 異常系②：最大幅違反。幅を 60.05 に広げる (> 60.0) -> FAIL
  # ==========================================
  - name: fail_wmax_60p05
    shapes:
      WN:
        - [-50.0, -50.0, 200.0, 200.0]
      ESD:
        - [-50.0, -50.0, 200.0, 200.0]
      AP:
        # ツールに「短い辺」と誤認させないため、Y方向の長さも大きく(150.0)しておく
        - [0.0, 0.0, 60.05, 150.0]
      GC:
        - [-5.0, 65.0, 65.0, 85.0]
    # こちらも上下の2箇所で発火すると想定
    expected_violations: 2