rule_id: M1P.PE
layers:
  M1: { number: 13, datatype: 0 }
  PO: { number: 14, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  - PP.W1
  - PP.S1
  - M1.W1
  - M1.W3
  - M1.S1
  - M1.PO
  - M1P.AA
  - M1P.GA
  - M1P.M1
  - M1P.PW
  - ERR01

cases:
  # ==========================================
  # 正常系：直線距離14.0、幅40.0 (外側/右端で揃える) -> PASS
  # ==========================================
  - name: pass_straight_40p0_14p0
    shapes:
      PO: [[0.0, 0.0, 100.0, 100.0]]
      M1:
        - [0.0, 0.0, 100.0, 100.0]       # パッド本体
        - [60.0, -14.0, 100.0, 0.0]      # 太い引き出し部 (幅40.0, 距離14.0)
        - [90.0, -30.0, 100.0, -14.0]    # 細い配線部 (幅10.0, 右端のX=100.0で一直線に揃える)
    expected_violations: 0

  # ==========================================
  # 正常系：直線距離14.0、幅40.05 (外側/右端で揃える) -> PASS
  # ==========================================
  - name: pass_straight_40p05_14p0
    shapes:
      PO: [[0.0, 0.0, 100.0, 100.0]]
      M1:
        - [0.0, 0.0, 100.0, 100.0]
        - [59.95, -14.0, 100.0, 0.0]     # 太い引き出し部 (幅40.05)
        - [90.0, -30.0, 100.0, -14.0]
    expected_violations: 0

  # ==========================================
  # 異常系：太い部分の幅が 40.0 未満 (39.95) -> FAIL (違反1件)
  # ==========================================
  - name: fail_straight_width_39p95
    shapes:
      PO: [[0.0, 0.0, 100.0, 100.0]]
      M1:
        - [0.0, 0.0, 100.0, 100.0]
        - [60.05, -14.0, 100.0, 0.0]     # 太い引き出し部 (幅39.95で幅不足)
        - [90.0, -30.0, 100.0, -14.0]
    expected_violations: 1

  # ==========================================
  # 異常系：太い部分の距離が 14.0 未満 (13.95) -> FAIL (違反1件)
  # ==========================================
  - name: fail_straight_len_13p95
    shapes:
      PO: [[0.0, 0.0, 100.0, 100.0]]
      M1:
        - [0.0, 0.0, 100.0, 100.0]
        - [60.0, -13.95, 100.0, 0.0]     # 太い引き出し部 (距離13.95で短すぎる)
        - [90.0, -30.0, 100.0, -13.95]   # 14.0に満たない位置で細くなってしまう
    expected_violations: 1