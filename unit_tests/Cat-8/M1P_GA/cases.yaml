rule_id: M1P.GA
layers:
  M1: { number: 13, datatype: 0 }
  PO: { number: 14, datatype: 0 }
  GC: { number: 8, datatype: 1 }
  AP: { number: 3, datatype: 1 } # GAを作るためのAAとして使用
allow_other_rules: false

waive_rule_ids:
  # PO/PP関連のエラーと、POとGA下地(GC/AP)とのスペース干渉を無視
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  - PO.AP
  - PO.GC
  - PP.W1
  - PP.S1
  # M1およびM1(P)関連のエラーを無視
  - M1.W1
  - M1.W3
  - M1.S1
  - M1.PO
  - M1P.AA    # GAの下地であるAP(AA)との距離違反が同時に出るため必ずWaive
  - M1P.M1
  - M1P.PE
  - M1P.PW
  # GA生成用下地(GC, AP)の単体ルールやアンテナエラーを無視
  - GC.W1
  - GC.S1
  - GC.ANT
  - GC.EP
  - AP.W1
  - AP.S1
  - AP.WN
  - GA.AP
  - GA.AN
  - GA.CO
  - GA.BG

cases:
  # ==========================================
  # 正常系：M1(P)とGAの間隔が 14.0 より大きい (14.05) -> PASS
  # ==========================================
  - name: pass_space_14p05
    shapes:
      PO: [[0.0, 0.0, 100.0, 100.0]]
      M1: [[0.0, 0.0, 100.0, 100.0]]
      # GCとAPを重ねて配置し、GA(Gate Active)を生成
      GC: [[114.05, 0.0, 124.05, 100.0]]
      AP: [[114.05, 0.0, 124.05, 100.0]]
    expected_violations: 0

  # ==========================================
  # 正常系：M1(P)とGAの間隔がピッタリ 14.0 -> PASS
  # ==========================================
  - name: pass_space_14p0
    shapes:
      PO: [[0.0, 0.0, 100.0, 100.0]]
      M1: [[0.0, 0.0, 100.0, 100.0]]
      # GCとAPを重ねて配置
      GC: [[114.0, 0.0, 124.0, 100.0]]
      AP: [[114.0, 0.0, 124.0, 100.0]]
    expected_violations: 0

  # ==========================================
  # 異常系：M1(P)とGAの間隔が 14.0 未満 (13.95) -> FAIL (違反1件)
  # ==========================================
  - name: fail_space_13p95_single
    shapes:
      PO: [[0.0, 0.0, 100.0, 100.0]]
      M1: [[0.0, 0.0, 100.0, 100.0]]
      # GCとAPを重ねて配置
      GC: [[113.95, 0.0, 123.95, 100.0]]
      AP: [[113.95, 0.0, 123.95, 100.0]]
    expected_violations: 1