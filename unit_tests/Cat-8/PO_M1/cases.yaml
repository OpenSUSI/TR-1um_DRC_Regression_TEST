rule_id: PO.M1
layers:
  PO: { number: 14, datatype: 0 }
  M1: { number: 13, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  # PO関連の単体・下地エラーを無視
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  # M1関連の単体・同層エラーを無視
  - M1.W1
  - M1.S1
  - M1.PO

cases:
  # ==========================================
  # 正常系：間隔が14.0より大きい (14.05) -> PASS
  # ==========================================
  - name: pass_space_14p05
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M1:
        # POの右端(100.0)から14.05離した位置に配置
        - [114.05, 0.0, 124.05, 100.0]
    expected_violations: 0

  # ==========================================
  # 正常系：間隔がピッタリ 14.0 -> PASS
  # ==========================================
  - name: pass_space_14p0
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M1:
        # POの右端(100.0)から14.0離した位置に配置
        - [114.0, 0.0, 124.0, 100.0]
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が14.0未満 (13.95) -> FAIL (違反1件)
  # ==========================================
  - name: fail_space_13p95_single
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M1:
        # POの右端(100.0)から13.95離した位置に配置
        - [113.95, 0.0, 123.95, 100.0]
    expected_violations: 1