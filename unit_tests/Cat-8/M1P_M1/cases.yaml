rule_id: M1P.M1
layers:
  M1: { number: 13, datatype: 0 }
  PO: { number: 14, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  # PO/PP関連のエラーを無視
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  - PP.W1
  - PP.S1
  # M1およびM1(P)関連のエラーを無視（M1P.M1以外）
  - M1.W1
  - M1.W3
  - M1.S1
  - M1.PO
  - M1P.AA
  - M1P.GA
  - M1P.PE
  - M1P.PW

cases:
  # ==========================================
  # 正常系：M1(P)と通常のM1の間隔が 14.0 より大きい (14.05) -> PASS
  # ==========================================
  - name: pass_space_14p05
    shapes:
      PO:
        # M1(P)を生成するための下地
        - [0.0, 0.0, 100.0, 100.0]
      M1:
        # 左：M1(P)本体 (POと重なる)
        - [0.0, 0.0, 100.0, 100.0]
        # 右：通常のM1 (間隔 14.05)
        - [114.05, 0.0, 124.05, 100.0]
    expected_violations: 0

  # ==========================================
  # 正常系：M1(P)と通常のM1の間隔がピッタリ 14.0 -> PASS
  # ==========================================
  - name: pass_space_14p0
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M1:
        - [0.0, 0.0, 100.0, 100.0]
        # 右：通常のM1 (間隔 14.0)
        - [114.0, 0.0, 124.0, 100.0]
    expected_violations: 0

  # ==========================================
  # 異常系：M1(P)と通常のM1の間隔が 14.0 未満 (13.95) -> FAIL (違反1件)
  # ==========================================
  - name: fail_space_13p95_single
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M1:
        - [0.0, 0.0, 100.0, 100.0]
        # 右：通常のM1 (間隔 13.95)
        - [113.95, 0.0, 123.95, 100.0]
    expected_violations: 1