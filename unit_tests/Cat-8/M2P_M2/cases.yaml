rule_id: M2P.M2
layers:
  M2: { number: 20, datatype: 0 }
  PO: { number: 14, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  # PO/PP関連のエラーを無視
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  - PP.W1
  - PP.S1
  # M2およびM2(P)関連のエラーを無視（M2P.M2以外）
  - M2.W1
  - M2.W3
  - M2.S1
  - M2.PO
  - M2P.AA
  - M2P.GA
  - M2P.PE
  - M2P.PW

cases:
  # ==========================================
  # 正常系：M2(P)と通常のM2の間隔が 14.0 より大きい (14.05) -> PASS
  # ==========================================
  - name: pass_space_14p05
    shapes:
      PO:
        # M2(P)を生成するための下地
        - [0.0, 0.0, 100.0, 100.0]
      M2:
        # 左：M2(P)本体 (POと重なる)
        - [0.0, 0.0, 100.0, 100.0]
        # 右：通常のM2 (間隔 14.05)
        - [114.05, 0.0, 124.05, 100.0]
    expected_violations: 0

  # ==========================================
  # 正常系：M2(P)と通常のM2の間隔がピッタリ 14.0 -> PASS
  # ==========================================
  - name: pass_space_14p0
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M2:
        - [0.0, 0.0, 100.0, 100.0]
        # 右：通常のM2 (間隔 14.0)
        - [114.0, 0.0, 124.0, 100.0]
    expected_violations: 0

  # ==========================================
  # 異常系：M2(P)と通常のM2の間隔が 14.0 未満 (13.95) -> FAIL (違反1件)
  # ==========================================
  - name: fail_space_13p95_single
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M2:
        - [0.0, 0.0, 100.0, 100.0]
        # 右：通常のM2 (間隔 13.95)
        - [113.95, 0.0, 123.95, 100.0]
    expected_violations: 1