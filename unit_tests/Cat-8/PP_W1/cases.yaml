rule_id: PP.W1
layers:
  PO: { number: 14, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  # PO関連の単体・下地エラーを無視
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  # PP関連の他のエラーを念のため無視
  - PP.S1

cases:
  # ==========================================
  # 正常系：幅が70.0より大きい (70.05) -> PASS
  # (高さが100.0なのでPPとして認識され、幅も70.0以上なのでOK)
  # ==========================================
  - name: pass_width_70p05
    shapes:
      PO:
        - [0.0, 0.0, 70.05, 100.0]
    expected_violations: 0

  # ==========================================
  # 正常系：幅がピッタリ 70.0 -> PASS
  # ==========================================
  - name: pass_width_70p0
    shapes:
      PO:
        - [0.0, 0.0, 70.0, 100.0]
    expected_violations: 0

  # ==========================================
  # 異常系：幅が70.0未満 (69.95) -> FAIL (違反1件)
  # (高さが100.0なのでPPとして認識されるが、幅が70.0未満なのでエラー発火)
  # ==========================================
  - name: fail_width_69p95
    shapes:
      PO:
        - [0.0, 0.0, 69.95, 100.0]
    expected_violations: 1