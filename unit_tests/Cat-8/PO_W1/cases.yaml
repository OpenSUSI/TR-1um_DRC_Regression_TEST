rule_id: PO.W1
layers:
  PO: { number: 14, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  # 単体テストなので発火しないはずですが、念のため同層のスペースエラーを無視
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  - PP.S1
  - PP.W1

cases:
  # ==========================================
  # 正常系：幅が10.0より大きい (10.05) -> PASS
  # ==========================================
  - name: pass_width_10p05
    shapes:
      PO:
        - [0.0, 0.0, 10.05, 100.0]
    expected_violations: 0

  # ==========================================
  # 正常系：幅がピッタリ 10.0 -> PASS
  # ==========================================
  - name: pass_width_10p0
    shapes:
      PO:
        - [0.0, 0.0, 10.0, 100.0]
    expected_violations: 0

  # ==========================================
  # 異常系：幅が10.0未満 (9.95) -> FAIL (違反1件)
  # ==========================================
  - name: fail_width_9p95
    shapes:
      PO:
        - [0.0, 0.0, 9.95, 100.0]
    expected_violations: 1