rule_id: M2.PO
layers:
  M2: { number: 20, datatype: 0 }
  PO: { number: 14, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  # PO関連の単体・下地エラーを無視
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  # M2の単体・同層エラーを無視
  - M2.W1
  - M2.S1

cases:
  # ==========================================
  # 正常系：M2がPOを 5.0 囲む -> PASS
  # ==========================================
  - name: pass_enclose_5p0
    shapes:
      PO:
        # POの最小幅(70.0)に引っかからないよう、100x100の大きな図形を配置
        - [0.0, 0.0, 100.0, 100.0]
      M2:
        # 全辺でピッタリ 5.0 囲む
        # (0.0 - 5.0 = -5.0,  100.0 + 5.0 = 105.0)
        - [-5.0, -5.0, 105.0, 105.0]
    expected_violations: 0

  # ==========================================
  # 異常系：1辺だけ M2の囲みが 4.95 (5.0未満) -> FAIL (違反1件)
  # ==========================================
  - name: fail_enclose_4p95_single
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M2:
        # 左・下・上は 5.0 囲むが、右端のみ 4.95 にする (100.0 + 4.95 = 104.95)
        - [-5.0, -5.0, 104.95, 105.0]
    expected_violations: 1

  # ==========================================
  # 異常系：全辺で M2の囲みが 4.95 (5.0未満) -> FAIL (違反4件)
  # ==========================================
  - name: fail_enclose_4p95_all
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M2:
        # 全辺で 4.95 しか囲まない
        - [-4.95, -4.95, 104.95, 104.95]
    expected_violations: 4