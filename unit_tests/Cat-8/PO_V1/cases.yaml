rule_id: PO.V1
layers:
  PO: { number: 14, datatype: 0 }
  V1: { number: 19, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  # PO関連の単体・下地エラーを無視
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  # V1関連の単体・下地・浮きエラーを無視
  - V1.W1
  - V1.S1
  - V1.Z1
  - V1.Z2

cases:
  # ==========================================
  # 正常系：V1がPOを 10.0 囲む -> PASS
  # ==========================================
  - name: pass_enclose_10p0
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      V1:
        # POの外側へ10.0の距離に配置
        - [-10.0, -10.0, 110.0, 110.0]
    expected_violations: 0

  # ==========================================
  # 異常系：左の1辺のみ V1の囲みが 9.95 (10.0未満) -> FAIL (違反1件)
  # ==========================================
  - name: fail_enclose_9p95_single
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      V1:
        # 左側だけ9.95に変更
        - [-9.95, -10.0, 110.0, 110.0]
    expected_violations: 1

  # ==========================================
  # 異常系：全辺で V1の囲みが 9.95 (10.0未満) -> FAIL (違反4件)
  # ==========================================
  - name: fail_enclose_9p95_all
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      V1:
        # 4辺すべてを9.95に変更
        - [-9.95, -9.95, 109.95, 109.95]
    expected_violations: 4