rule_id: PO.V1
layers:
  PO: { number: 14, datatype: 0 }
  V1: { number: 19, datatype: 0 }
  M1: { number: 13, datatype: 0 }
  M2: { number: 20, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  - V1.W1
  - V1.S1
  - M1.W1
  - M1.S1
  - M2.W1
  - M2.S1
  - M1.PO
  - M2.PO
  - M1.V1
  - M2.V1

cases:
  # ==========================================
  # 正常系：V1がPOを 10.0 囲む -> PASS
  # ==========================================
  - name: pass_enclose_10p0
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M1:
        - [-10.0, -10.0, 110.0, 110.0]
      M2:
        - [-10.0, -10.0, 110.0, 110.0]
      V1:
        # PO(0.0, 100.0)の外側へ10.0の距離に配置
        - [-10.0, -10.0, 110.0, 110.0]
    expected_violations: 0

  # ==========================================
  # 異常系：左の1辺のみ V1の囲みが 9.95 (10.0未満) -> FAIL (違反1件)
  # ==========================================
  - name: fail_enclose_9p95_single
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M1:
        - [-10.0, -10.0, 110.0, 110.0]
      M2:
        - [-10.0, -10.0, 110.0, 110.0]
      V1:
        # 左側だけ9.95に変更
        - [-9.95, -10.0, 110.0, 110.0]
    expected_violations: 1

  # ==========================================
  # 異常系：全辺で V1の囲みが 9.95 (10.0未満) -> FAIL (違反4件)
  # ==========================================
  - name: fail_enclose_9p95_all
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
      M1:
        - [-10.0, -10.0, 110.0, 110.0]
      M2:
        - [-10.0, -10.0, 110.0, 110.0]
      V1:
        # 4辺すべてを9.95に変更
        - [-9.95, -9.95, 109.95, 109.95]
    expected_violations: 4