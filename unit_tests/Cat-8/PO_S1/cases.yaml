rule_id: PO.S1
layers:
  PO: { number: 14, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  # 単体ルールのエラーや、下地不足によるエラーを無視
  - PO.W1
  - PO.Z1
  - PO.Z2
  - PO.Z3

cases:
  # ==========================================
  # 正常系：間隔が64.0より大きい (64.05) -> PASS
  # ==========================================
  - name: pass_space_64p05
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
        # 1つ目の右端(100.0) + 間隔(64.05) = 左端(164.05)
        - [164.05, 0.0, 264.05, 100.0]
    expected_violations: 0

  # ==========================================
  # 正常系：間隔がピッタリ 64.0 -> PASS
  # ==========================================
  - name: pass_space_64p0
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
        # 1つ目の右端(100.0) + 間隔(64.0) = 左端(164.0)
        - [164.0, 0.0, 264.0, 100.0]
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が64.0未満 (63.95) -> FAIL (違反1件)
  # ==========================================
  - name: fail_space_63p95_single
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
        # 1つ目の右端(100.0) + 間隔(63.95) = 左端(163.95)
        - [163.95, 0.0, 263.95, 100.0]
    expected_violations: 1