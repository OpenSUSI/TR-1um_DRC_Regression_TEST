rule_id: PO.S1
layers:
  PO: { number: 14, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  # 単体ルールのエラーや、下地不足によるエラーを無視
  - PO.W1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  - PP.S1
  - PP.W1

cases:
  # ==========================================
  # 正常系：間隔が20.0より大きい (20.05) -> PASS
  # ==========================================
  - name: pass_space_20p05
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
        # 1つ目の右端(100.0) + 間隔(20.05) = 左端(120.05)
        - [120.05, 0.0, 220.05, 100.0]
    expected_violations: 0

  # ==========================================
  # 正常系：間隔がピッタリ 20.0 -> PASS
  # ==========================================
  - name: pass_space_20p0
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
        # 1つ目の右端(100.0) + 間隔(20.0) = 左端(120.0)
        - [120.0, 0.0, 220.0, 100.0]
    expected_violations: 0

  # ==========================================
  # 異常系：間隔が20.0未満 (19.95) -> FAIL (違反1件)
  # ==========================================
  - name: fail_space_19p95_single
    shapes:
      PO:
        - [0.0, 0.0, 100.0, 100.0]
        # 1つ目の右端(100.0) + 間隔(19.95) = 左端(119.95)
        - [119.95, 0.0, 219.95, 100.0]
    expected_violations: 1