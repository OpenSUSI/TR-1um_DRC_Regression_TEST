rule_id: M1.V1P
layers:
  M1: { number: 13, datatype: 0 }
  V1: { number: 19, datatype: 0 }
  PO: { number: 14, datatype: 0 }
allow_other_rules: false

waive_rule_ids:
  # PO関連の単体・下地エラーを無視
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  # M1およびM1(P)関連のエラーを無視
  - M1.W1
  - M1.W3
  - M1.S1
  - M1.PO
  - M1P.AA
  - M1P.GA
  - M1P.M1
  - M1P.PE
  - M1P.PW
  # V1関連の単体・浮き・囲みエラーを無視
  - V1.W1
  - V1.S1
  - V1.Z1
  - V1.Z2
  - V1.M1
  - V1.M2
  - V1.CO
  - V1.GA

cases:
  # ==========================================
  # 正常系：M1がV1(P)を 15.0 囲む -> PASS
  # ==========================================
  - name: pass_enclose_15p0
    shapes:
      PO:
        # V1をV1(P)にするための下地
        - [0.0, 0.0, 20.0, 20.0]
      V1:
        # 1.4 x 1.4 のビア
        - [10.0, 10.0, 11.4, 11.4]
      M1:
        # V1(10.0〜11.4)をピッタリ 15.0 囲む
        # (10.0 - 15.0 = -5.0,  11.4 + 15.0 = 26.4)
        - [-5.0, -5.0, 26.4, 26.4]
    expected_violations: 0

  # ==========================================
  # 異常系：1辺だけ M1の囲みが 14.95 (15.0未満) -> FAIL (違反1件)
  # ==========================================
  - name: fail_enclose_14p95_single
    shapes:
      PO:
        - [0.0, 0.0, 20.0, 20.0]
      V1:
        - [10.0, 10.0, 11.4, 11.4]
      M1:
        # 左端だけ -4.95 にして、囲みを 14.95 にする
        - [-4.95, -5.0, 26.4, 26.4]
    expected_violations: 1

  # ==========================================
  # 異常系：全辺で M1の囲みが 14.95 (15.0未満) -> FAIL (違反4件)
  # ==========================================
  - name: fail_enclose_14p95_all
    shapes:
      PO:
        - [0.0, 0.0, 20.0, 20.0]
      V1:
        - [10.0, 10.0, 11.4, 11.4]
      M1:
        # 全辺で 14.95 の囲みにする
        - [-4.95, -4.95, 26.35, 26.35]
    expected_violations: 4