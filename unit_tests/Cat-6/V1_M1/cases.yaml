rule_id: V1.M1

layers:
  # V1レイヤー: 19番, Datatype 0
  V1: { number: 19, datatype: 0 }
  # M1レイヤー: 13番, Datatype 0
  M1: { number: 13, datatype: 0 }

allow_other_rules: false
# ビアのサイズ(V1.W1)や間隔(V1.S1)、M2による囲み(V1.M2)、
# およびビア浮きエラー(V1.Z1, V1.Z2)など、無関係なエラーを無視
waive_rule_ids:
  - V1.W1
  - V1.S1
  - V1.M2
  - V1.Z1
  - V1.Z2
  - M1.W1
  - M1.S1

cases:
  - name: pass_enclose_1p0
    shapes:
      V1:
        # V1ビア (1.4 x 1.4)
        - [10.0, 10.0, 11.4, 11.4]
      M1:
        # 基準寸法 1.0 を確保して囲む (10.0-1.0=9.0, 11.4+1.0=12.4)
        - [9.0, 9.0, 12.4, 12.4]
    expected_violations: 0

  - name: fail_enclose_0p95_all
    shapes:
      V1:
        - [10.0, 10.0, 11.4, 11.4]
      M1:
        # 全辺で 0.05 ずらして 0.95 にする (10.0-0.95=9.05, 11.4+0.95=12.35)
        - [9.05, 9.05, 12.35, 12.35]
    # 全辺(4辺)で違反するため 4
    expected_violations: 4

  - name: fail_enclose_0p95_single
    shapes:
      V1:
        - [10.0, 10.0, 11.4, 11.4]
      M1:
        # 下辺(Ymin)のみ 0.95 にし、他は 1.0 確保
        - [9.0, 9.05, 12.4, 12.4]
    # 1辺のみ違反するため 1
    expected_violations: 1