rule_id: V1.GC

layers:
  # V1レイヤー: 19番, Datatype 0
  V1: { number: 19, datatype: 0 }
  # GCレイヤー: 8番, Datatype 1
  GC: { number: 8, datatype: 1 }

allow_other_rules: false
# V1やGCの単体ルール(幅や同レイヤー間隔)、およびビア浮きエラー(V1.Z1, V1.Z2)を無視
waive_rule_ids:
  - V1.W1
  - V1.S1
  - V1.M1
  - V1.M2
  - V1.Z1
  - V1.Z2
  - GC.W1
  - GC.S1

cases:
  - name: pass_space_1p2
    shapes:
      V1:
        # V1ビア (1.4 x 1.4)
        - [0.0, 0.0, 1.4, 1.4]
      GC:
        # GC (適当な幅2.0) / V1との基準寸法 1.2 を確保 (1.4 + 1.2 = 2.6)
        - [2.6, 0.0, 4.6, 1.4]
    expected_violations: 0

  - name: fail_space_1p15_single
    shapes:
      V1:
        - [0.0, 0.0, 1.4, 1.4]
      GC:
        # 隙間を 0.05 ずらして 1.15 にする (1.4 + 1.15 = 2.55)
        - [2.55, 0.0, 4.55, 1.4]
    expected_violations: 1

  - name: fail_space_1p15_double
    shapes:
      V1:
        # 中央のV1ビア
        - [0.0, 0.0, 1.4, 1.4]
      GC:
        # 右側のGC (隙間 1.15)
        - [2.55, 0.0, 4.55, 1.4]
        # 左側のGC (隙間 1.15 -> 0.0 - 1.15 = -1.15。幅2.0なので -3.15 からスタート)
        - [-3.15, 0.0, -1.15, 1.4]
    expected_violations: 2