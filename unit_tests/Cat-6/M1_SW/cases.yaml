rule_id: M1.SW

layers:
  # M1レイヤー: 13番, Datatype 0
  M1: { number: 13, datatype: 0 }

allow_other_rules: false
# M1の通常スペースエラー(M1.S1)や幅エラー(M1.W1)など、太い配線チェックに無関係なエラーを無視
waive_rule_ids:
  - M1.S1
  - M1.W1

cases:
  - name: pass_space_2p0
    shapes:
      M1:
        # 1つ目: 確実にWIDEと判定させる超巨大配線 (200.0 x 200.0)
        - [0.0, 0.0, 200.0, 200.0]
        # 2つ目: 通常の配線 (幅3.0) / 基準寸法 2.0 を確保 (200.0 + 2.0 = 202.0)
        - [202.0, 0.0, 205.0, 200.0]
    expected_violations: 0

  - name: fail_space_1p5_single
    shapes:
      M1:
        # 確実にWIDEな配線 (200.0 x 200.0)
        - [0.0, 0.0, 200.0, 200.0]
        # 通常の配線 (幅3.0) / 隙間を 1.5 にする (200.0 + 1.5 = 201.5)
        - [201.5, 0.0, 204.5, 200.0]
    expected_violations: 1

  - name: fail_space_1p5_double
    shapes:
      M1:
        # 中央のWIDE配線 (200.0 x 200.0)
        - [0.0, 0.0, 200.0, 200.0]
        # 右側の通常配線 (幅3.0, 隙間 1.5)
        - [201.5, 0.0, 204.5, 200.0]
        # 左側の通常配線 (幅3.0, 隙間 1.5 -> 0.0 - 1.5 = -1.5。幅3.0なので -4.5 からスタート)
        - [-4.5, 0.0, -1.5, 200.0]
    expected_violations: 2

  - name: fail_space_1p95_single
    shapes:
      M1:
        # 確実にWIDEな配線 (200.0 x 200.0)
        - [0.0, 0.0, 200.0, 200.0]
        # 通常の配線 (幅3.0) / 隙間を 1.95 にする (200.0 + 1.95 = 201.95)
        - [201.95, 0.0, 204.95, 200.0]
    expected_violations: 1