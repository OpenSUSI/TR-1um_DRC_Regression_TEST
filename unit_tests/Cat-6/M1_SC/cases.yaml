rule_id: M1.SC

layers:
  M1: { number: 13, datatype: 0 }
  AC: { number: 3, datatype: 4 }
  WN: { number: 140, datatype: 0 }
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  - M1.W1
  - M1.S1
  - AC.W1
  - AC.S1
  - AC.WC
  - AC.R1
  - WN.W1
  - WN.S1
  - WN.S6
  - WN.Z1
  - WN.Z2
  - WN.Z3
  - AN.W1
  - AN.S1
  - AN.WC
  - WN.AN
  - DN.AN

cases:
  - name: test_notch_space_10p0
    shapes:
      M1:  # ※対象のレイヤー名（APなど）に適宜変更してください
        - [0.0, 0.0, 2.0, 10.0]    # 左側の縦の長方形
        - [2.0, 0.0, 12.0, 2.0]    # 底辺の長方形 (X座標 2.0 〜 12.0 = 幅10.0)
        - [12.0, 0.0, 14.0, 10.0]  # 右側の縦の長方形
    expected_violations: 0

  - name: test_notch_space_9p95
    shapes:
      M1:
        - [0.0, 0.0, 2.0, 10.0]    # 左側の縦の長方形
        - [2.0, 0.0, 11.95, 2.0]    # 底辺の長方形 (X座標 2.0 〜 11.95 = 幅9.95)
        - [11.95, 0.0, 13.95, 10.0]  # 右側の縦の長方形
    expected_violations: 1  

  - name: test_notch_space_0p05
    shapes:
      M1:
        - [0.0, 0.0, 2.0, 10.0]    # 左側の縦の長方形
        - [2.0, 0.0, 2.05, 2.0]    # 底辺の長方形 (X座標 2.0 〜 2.05 = 幅0.05)
        - [2.05, 0.0, 4.05, 10.0]  # 右側の縦の長方形
    expected_violations: 1  

  - name: fail_corner_touch_0p0
    shapes:
      M1:
        # 座標 (5.0, 5.0) でカドとカドが1点だけ接する2つの矩形
        # ※実質的にスペースが0.0となるため、Smin違反（またはポリゴン異常）として検知されるべき
        - [0.0, 0.0, 5.0, 5.0]     # 左下の長方形
        - [5.0, 5.0, 10.0, 10.0]   # 右上の長方形
    expected_violations: 1