rule_id: M1.SC

layers:
  M1: { number: 13, datatype: 0 }
  AC: { number: 3, datatype: 4 }
  WN: { number: 140, datatype: 0 }
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  - M1.W1
  - M1.S1
  - AC.W1
  - AC.S1
  - AC.WC
  - AC.R1
  - WN.W1
  - WN.S1
  - WN.S6
  - WN.Z1
  - WN.Z2
  - WN.Z3
  - AN.W1
  - AN.S1
  - AN.WC
  - WN.AN
  - DN.AN

cases:
  - name: test_notch_space_10p0
    shapes:
      M1:
        - [0.0, 0.0, 2.0, 10.0]
        - [2.0, 0.0, 12.0, 2.0]
        - [12.0, 0.0, 14.0, 10.0]
    expected_violations: 0

  - name: test_notch_space_9p95
    shapes:
      M1:
        - [0.0, 0.0, 2.0, 10.0]
        - [2.0, 0.0, 11.95, 2.0]
        - [11.95, 0.0, 13.95, 10.0]
    expected_violations: 1

  - name: test_notch_space_0p05
    shapes:
      M1:
        - [0.0, 0.0, 2.0, 10.0]
        - [2.0, 0.0, 2.05, 2.0]
        - [2.05, 0.0, 4.05, 10.0]
    expected_violations: 1

  - name: fail_corner_touch_0p0
    shapes:
      M1:
        - [0.0, 0.0, 5.0, 5.0]
        - [5.0, 5.0, 10.0, 10.0]
    expected_violations: 1

  # 追加：コーナー間のスペースが十分に空いているケース（X,Y共に10.0の隙間）
  - name: pass_corner_space_large
    shapes:
      M1:
        - [0.0, 0.0, 5.0, 5.0]
        - [15.0, 15.0, 20.0, 20.0]
    expected_violations: 0

  # 追加：コーナー間のスペースがわずかに空いているケース（X,Y共に0.5の隙間）
  - name: fail_corner_space_small
    shapes:
      M1:
        - [0.0, 0.0, 5.0, 5.0]
        - [5.5, 5.5, 10.5, 10.5]
    expected_violations: 1