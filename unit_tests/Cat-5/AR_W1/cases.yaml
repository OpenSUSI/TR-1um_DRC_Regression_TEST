rule_id: AR.W1

layers:
  AR: { number: 3, datatype: 3 }
  GC: { number: 8, datatype: 1 }
  GR: { number: 8, datatype: 2 }
  CO: { number: 11, datatype: 0 }
  M1: { number: 13, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - AR.L1
  - AR.S1
  - AR.XY
  - GC.R1
  - GC.R2
  - GC.W1
  - GC.S1
  - GR.L1
  - GR.S1
  - GR.W1
  - CO.GC
  - CO.S1
  - CO.W1
  - CO.Z1
  - CO.Z3
  - M1.CL
  - M1.S1
  - M1.W1
  - CR.AS
  - CR.AT
  - CR.W2

cases:
  # ==========================================
  # 正常系：Wを 10.0 にする (Lは30.0で固定) -> PASS
  # ==========================================
  - name: pass_width_10p0
    shapes:
      AR: [[0.0, 0.0, 10.0, 36.0]]    # 幅10.0
      GC: [[-1.0, 1.0, 11.0, 35.0]]
      GR: [[-1.0, 1.0, 11.0, 35.0]]
      CO: 
        - [0.0, 1.0, 10.0, 3.0]       # 下のコンタクト (幅10.0)
        - [0.0, 33.0, 10.0, 35.0]     # 上のコンタクト (幅10.0)
      M1: [[-1.0, 1.0, 11.0, 35.0]]
    expected_violations: 0

  # ==========================================
  # 異常系①：Wmin違反 (境界値テスト: 2.75) -> 違反数: 2
  # ==========================================
  - name: fail_wmin_2p75
    shapes:
      AR: [[0.0, 0.0, 2.75, 36.0]]    # 幅2.75 (< 2.8)
      GC: [[-0.5, 1.0, 3.25, 35.0]]
      GR: [[-0.5, 1.0, 3.25, 35.0]]
      CO: 
        - [0.0, 1.0, 2.75, 3.0]       # コンタクトも幅2.75に合わせる
        - [0.0, 33.0, 2.75, 35.0]
      M1: [[-0.5, 1.0, 3.25, 35.0]]
    expected_violations: 2

  # ==========================================
  # 異常系②：Wmax違反 (境界値テスト: 20.05) -> 違反数: 2
  # ==========================================
  - name: fail_wmax_20p05
    shapes:
      AR: [[0.0, 0.0, 20.05, 36.0]]   # 幅20.05 (> 20.0)
      GC: [[-1.0, 1.0, 21.05, 35.0]]
      GR: [[-1.0, 1.0, 21.05, 35.0]]
      CO: 
        - [0.0, 1.0, 20.05, 3.0]      # コンタクトも幅20.05に合わせる
        - [0.0, 33.0, 20.05, 35.0]
      M1: [[-1.0, 1.0, 21.05, 35.0]]
    expected_violations: 2