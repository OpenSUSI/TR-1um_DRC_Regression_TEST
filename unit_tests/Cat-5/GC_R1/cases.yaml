rule_id: GC.R1

layers:
  AR: { number: 3, datatype: 3 }
  GC: { number: 8, datatype: 1 }
  WN: { number: 140, datatype: 0 }  # WN(R)を生成するための物理レイヤー

allow_other_rules: false
waive_rule_ids:
  - AR.L1
  - AR.PW
  - AR.S1
  - AR.W1
  - AR.WR
  - AR.XY
  - GC.R2
  - GC.S1
  - GC.W1
  - WN.AN
  - WN.AP
  - WN.S1
  - WN.S2
  - WN.S3
  - WN.W1

cases:
  # ==========================================
  # 正常系：GCのドーナツの中にARが完全に収まっている
  # ==========================================
  - name: pass_donut_enclosed
    shapes:
      WN:
        - [-5.0, -5.0, 25.0, 25.0]
      GC:
        - [0.0, 0.0, 5.0, 20.0]
        - [15.0, 0.0, 20.0, 20.0]
        - [0.0, 0.0, 20.0, 5.0]
        - [0.0, 15.0, 20.0, 20.0]
      AR:
        - [7.0, 7.0, 13.0, 13.0]
    expected_violations: 0

  # ==========================================
  # 異常系①：ARがGCの穴からはみ出し、GCに被っている
  # 引き算の結果、「ロの字型」の1つの図形が残るため違反数は1
  # ==========================================
  - name: fail_donut_overlap
    shapes:
      WN:
        - [-5.0, -5.0, 25.0, 25.0]
      GC:
        - [0.0, 0.0, 5.0, 20.0]
        - [15.0, 0.0, 20.0, 20.0]
        - [0.0, 0.0, 20.0, 5.0]
        - [0.0, 15.0, 20.0, 20.0]
      AR:
        - [4.0, 4.0, 16.0, 16.0]
    expected_violations: 1

  # ==========================================
  # 異常系②：GCのドーナツがない（ただの四角形の中にARがある）
  # 穴が全くないため、図形全体が1つのエラーとしてカウントされる
  # ==========================================
  - name: fail_no_donut
    shapes:
      WN:
        - [-5.0, -5.0, 25.0, 25.0]
      GC:
        - [0.0, 0.0, 20.0, 20.0]
      AR:
        - [7.0, 7.0, 13.0, 13.0]
    expected_violations: 1