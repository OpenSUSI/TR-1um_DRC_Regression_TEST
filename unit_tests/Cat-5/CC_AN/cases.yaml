rule_id: CC.AN

layers:
  CO: { number: 11, datatype: 0 }
  AC: { number: 3, datatype: 4 } # キャパシタ認識用下地
  AN: { number: 3, datatype: 2 } 
allow_other_rules: false
waive_rule_ids:
  # これまでクリアしたCC系ルールや、単体形状エラーをすべてWaive
  - AC.L1
  - AC.R1
  - AC.S1
  - AC.W1
  - AC.XY
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - CO.AD
  - CC.W1
  - CC.S1
  - CC.AC

cases:
  # ==========================================
  # 正常系：ANの境界から、COをぴったり 1.2μm 内側に配置 -> PASS
  # ==========================================
  - name: pass_enclose_1p2
    shapes:
      AC:
        # CC.AC(2.9) を回避するため、ACは非常に大きくしておく
        - [-10.0, -10.0, 30.0, 30.0]
      AN:
        - [0.0, 0.0, 10.0, 10.0]
      CO:
        # ANの左下(0.0, 0.0)から、X方向・Y方向ともに 1.2 内側に配置
        - [1.2, 1.2, 2.4, 2.4]
    expected_violations: 0

  # ==========================================
  # 異常系①：左辺(X方向)を 1.15 に近づける -> FAIL
  # ==========================================
  - name: fail_enclose_x_1p15
    shapes:
      AC:
        - [-10.0, -10.0, 30.0, 30.0]
      AN:
        - [0.0, 0.0, 10.0, 10.0]
      CO:
        # 左端を 1.15 までANの端(0.0)に近づける
        - [1.15, 1.2, 2.35, 2.4]
    expected_violations: 1

  # ==========================================
  # 異常系②：下辺(Y方向)を 1.15 に近づける -> FAIL
  # ==========================================
  - name: fail_enclose_y_1p15
    shapes:
      AC:
        - [-10.0, -10.0, 30.0, 30.0]
      AN:
        - [0.0, 0.0, 10.0, 10.0]
      CO:
        # 下端を 1.15 までANの端(0.0)に近づける
        - [1.2, 1.15, 2.4, 2.35]
    expected_violations: 1