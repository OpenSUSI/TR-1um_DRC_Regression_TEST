rule_id: GR.W1

layers:
  GC: { number: 8, datatype: 1 }
  GR: { number: 8, datatype: 2 }
  CO: { number: 11, datatype: 0 }
  M1: { number: 13, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  # GR.W1(幅)に無関係なエラーをすべて無視
  - GR.L1
  - GR.S1
  - GC.R1
  - GC.R2
  - GC.W1
  - GC.S1
  - CO.GC
  - CO.S1
  - CO.W1
  - CO.Z1
  - CO.Z3
  - M1.CL
  - M1.S1
  - M1.W1

cases:
  # ==========================================
  # 正常系：COのX幅を 10.0 にする (4.0 〜 20.0 の範囲内) -> PASS
  # ==========================================
  - name: pass_width_10p0
    shapes:
      # 下地となる抵抗体 (幅に余裕を持たせる)
      GC: [-5.0, 0.0, 25.0, 40.0]
      GR: [-5.0, 0.0, 25.0, 40.0]
      M1: [-5.0, 0.0, 25.0, 40.0]
      CO:
        # X幅 10.0 (X=5.0〜15.0)、Y幅 10.0 のコンタクトを上下に配置
        - [5.0, 5.0, 15.0, 15.0]
        - [5.0, 25.0, 15.0, 35.0]
    expected_violations: 0

  # ==========================================
  # 異常系①：Wmin違反。COのX幅を 3.95 にする (< 4.0)
  # コンタクト2箇所 × 対向2辺 = 計4件の違反
  # ==========================================
  - name: fail_wmin_3p95
    shapes:
      GC: [-5.0, 0.0, 25.0, 40.0]
      GR: [-5.0, 0.0, 25.0, 40.0]
      M1: [-5.0, 0.0, 25.0, 40.0]
      CO:
        # X幅 3.95 (X=5.0〜8.95)
        - [5.0, 5.0, 8.95, 15.0]
        - [5.0, 25.0, 8.95, 35.0]
    expected_violations: 4

  # ==========================================
  # 異常系②：Wmax違反。COのX幅を 20.05 にする (> 20.0)
  # コンタクト2箇所 × 対向2辺 = 計4件の違反
  # ==========================================
  - name: fail_wmax_20p05
    shapes:
      GC: [-5.0, 0.0, 25.0, 40.0]
      GR: [-5.0, 0.0, 25.0, 40.0]
      M1: [-5.0, 0.0, 25.0, 40.0]
      CO:
        # X幅 20.05 (X=0.0〜20.05)
        - [0.0, 5.0, 20.05, 15.0]
        - [0.0, 25.0, 20.05, 35.0]
    expected_violations: 4