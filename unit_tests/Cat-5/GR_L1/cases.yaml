rule_id: GR.L1

layers:
  GC: { number: 8, datatype: 1 }
  GR: { number: 8, datatype: 2 }
  CO: { number: 11, datatype: 0 }
  M1: { number: 13, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  # 長さチェック(GR.L1)に無関係なルールをすべて無視
  - GR.W1
  - GR.S1
  - GC.R1
  - GC.R2
  - GC.W1
  - GC.S1
  - CO.GC
  - CO.S1
  - CO.W1
  - CO.Z1
  - CO.Z3
  - M1.CL
  - M1.S1
  - M1.W1

cases:
  # ==========================================
  # 正常系：長さ(L)を 50.0 にする (20.0 〜 100.0 の範囲内) -> PASS
  # ==========================================
  - name: pass_length_50p0
    shapes:
      GC:
        - [-5.0, 0.0, 15.0, 70.0]
      GR:
        - [-5.0, 0.0, 15.0, 70.0]
      M1:
        - [-5.0, 0.0, 15.0, 70.0]
      CO:
        - [0.0, 5.0, 10.0, 10.0]
        - [0.0, 60.0, 10.0, 65.0]
    expected_violations: 0

# ==========================================
  # 異常系①：Lmin違反。長さを 19.95 にする (< 20.0)
  # ==========================================
  - name: fail_lmin_19p95
    shapes:
      GC:
        - [-5.0, 0.0, 25.0, 19.95]
      GR:
        - [-5.0, 0.0, 25.0, 19.95]
      M1:
        - [-5.0, 0.0, 25.0, 19.95]
      CO:
        - [0.0, 1.0, 20.0, 3.0]
        - [0.0, 16.95, 20.0, 18.95]
    # ツール仕様により複数エッジ（6箇所）で発火するため期待値を6に設定
    expected_violations: 6

  # ==========================================
  # 異常系②：Lmax違反。長さを 100.05 にする (> 100.0)
  # ==========================================
  - name: fail_lmax_100p05
    shapes:
      GC:
        - [-5.0, 0.0, 15.0, 120.0]
      GR:
        - [-5.0, 0.0, 15.0, 120.0]
      M1:
        - [-5.0, 0.0, 15.0, 120.0]
      CO:
        - [0.0, 5.0, 10.0, 10.0]
        - [0.0, 110.05, 10.0, 115.05]
    expected_violations: 2