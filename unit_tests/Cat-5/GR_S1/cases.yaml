rule_id: GR.S1

layers:
  GC: { number: 8, datatype: 1 }
  GR: { number: 8, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  - GR.W1
  - GR.L1
  - GC.R1
  - GC.R2
  - GC.W1
  - GC.S1

cases:
  # ==========================================
  # 正常系：抵抗体同士の隙間をぴったり 2.0 にする -> PASS
  # ==========================================
  - name: pass_space_2p0
    shapes:
      GC:
        - [0.0, 0.0, 10.0, 20.0]
        - [12.0, 0.0, 22.0, 20.0]
      GR:
        - [0.0, 0.0, 10.0, 20.0]
        - [12.0, 0.0, 22.0, 20.0]
    expected_violations: 0

  # ==========================================
  # 異常系①：隙間が 1.95 のエラー (空間単位の検知のため違反数は1)
  # ==========================================
  - name: fail_space_1p95_single
    shapes:
      GC:
        - [0.0, 0.0, 10.0, 20.0]
        - [11.95, 0.0, 21.95, 20.0]
      GR:
        - [0.0, 0.0, 10.0, 20.0]
        - [11.95, 0.0, 21.95, 20.0]
    expected_violations: 1

  # ==========================================
  # 異常系②：隙間 1.95 のエラーが2箇所 (違反数は2)
  # ==========================================
  - name: fail_space_1p95_double
    shapes:
      GC:
        - [0.0, 0.0, 10.0, 20.0]
        - [11.95, 0.0, 21.95, 20.0]
        - [23.90, 0.0, 33.90, 20.0]
      GR:
        - [0.0, 0.0, 10.0, 20.0]
        - [11.95, 0.0, 21.95, 20.0]
        - [23.90, 0.0, 33.90, 20.0]
    expected_violations: 2