rule_id: AR.XY

layers:
  AR: { number: 3, datatype: 3 }

allow_other_rules: false
waive_rule_ids:
  - AR.W1
  - AR.S1
  - AR.L1
  - GC.R1

cases:
  # ==========================================
  # 正常系：八角形（面積OK）-> 期待値 0
  # ==========================================
  - name: pass_8edges_1p0
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 9.0]
        - [1.0, 9.0, 9.0, 10.0]
    expected_violations: 0

  # ==========================================
  # 異常系①：八角形だが面積不足 (0.49) -> 期待値 2
  # ==========================================
  - name: fail_8edges_small_area
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 9.3]
        - [0.7, 9.3, 9.3, 10.0]
    expected_violations: 2

  # ==========================================
  # 異常系②：6辺（六角形）で面積十分 (1.0以上)
  # 辺数エラー(6件)のみ発火 -> 期待値 6
  # ==========================================
  - name: fail_6edges_large_area
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 9.0]
        - [0.0, 9.0, 9.0, 10.0]
    expected_violations: 6

  # ==========================================
  # 異常系③：6辺（六角形）で面積不足 (0.09)
  # 辺数エラー(6件) + 面積エラー(1件) -> 期待値 7
  # ==========================================
  - name: fail_6edges_small_area
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 9.7]
        - [0.0, 9.7, 9.7, 10.0]
    expected_violations: 7

  # ==========================================
  # 異常系④：四角形（4辺） -> 期待値 4
  # ==========================================
  - name: fail_shape_not_8edges
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 4