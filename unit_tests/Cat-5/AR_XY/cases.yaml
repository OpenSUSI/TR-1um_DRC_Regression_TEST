rule_id: AR.XY

layers:
  AR: { number: 3, datatype: 3 }

allow_other_rules: false
waive_rule_ids:
  - AR.S1
  - AR.W1
  - AR.L1
  - GC.R1

cases:
  # ==========================================
  # 正常系：8辺あり、カット面積が十分にある八角形 -> PASS
  # cut: 1.5 の場合、角の三角形の面積は (1.5 * 1.5) / 2 = 1.125 (> 0.50)
  # ==========================================
  - name: pass_octagon
    shapes:
      AR:
        - type: octagon
          box: [0.0, 0.0, 10.0, 10.0]
          cut: 1.5
    expected_violations: 0

  # ==========================================
  # 異常系①：八角形ではない（四角形/4辺） -> 違反数: 4
  # 四隅すべてがカットされていないため、4箇所のコーナーでそれぞれエラーになる
  # ==========================================
  - name: fail_rectangle
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 4

  # ==========================================
  # 異常系②：カット面積不足 (cut: 0.5) -> 違反数: 4 (4つの角)
  # cut: 0.5 の場合、角の三角形の面積は (0.5 * 0.5) / 2 = 0.125 (< 0.50)
  # ==========================================
  - name: fail_small_cut
    shapes:
      AR:
        - type: octagon
          box: [0.0, 0.0, 10.0, 10.0]
          cut: 0.5
    expected_violations: 4