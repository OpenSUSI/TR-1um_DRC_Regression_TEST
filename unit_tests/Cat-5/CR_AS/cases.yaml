rule_id: CR.AS

layers:
  CO: { number: 11, datatype: 0 }
  AR: { number: 3, datatype: 3 }
  WN: { number: 140, datatype: 0 }  # 抵抗体認識用の物理下地

allow_other_rules: false
waive_rule_ids:
  - AR.L1
  - AR.W1
  - AR.XY
  - AR.WR
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - CR.W1
  - CR.W2
  - CR.AT
  - GC.R1
  - GC.R2

cases:
  # ==========================================
  # 正常系：ARの横端から、COがぴったり 1.0μm 内側にある -> PASS
  # ==========================================
  - name: pass_enclose_1p0
    shapes:
      WN:
        - [-5.0, -5.0, 20.0, 20.0]
      AR:
        - [0.0, 0.0, 10.0, 10.0]     # ARの左端は X=0.0、右端は X=10.0
      CO:
        # ARの左端(0.0)から、ぴったり1.0離した位置(X=1.0)にCOの左端を配置
        - [1.0, 4.5, 2.0, 5.5]       # 1.0 x 1.0 の標準コンタクト
    expected_violations: 0

  # ==========================================
  # 異常系：COを横端に 0.95μm まで近づける（包み込み不足） -> FAIL
  # ==========================================
  - name: fail_enclose_0p95
    shapes:
      WN:
        - [-5.0, -5.0, 20.0, 20.0]
      AR:
        - [0.0, 0.0, 10.0, 10.0]
      CO:
        # ARの左端(0.0)から 0.95 の位置までCOを左に寄せる
        - [0.95, 4.5, 1.95, 5.5]
    # エッジベースまたは図形単位での検出を想定し、まずは 1 を設定
    expected_violations: 1