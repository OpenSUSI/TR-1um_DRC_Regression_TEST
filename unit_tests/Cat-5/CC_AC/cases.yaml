rule_id: CC.AC

layers:
  CO: { number: 11, datatype: 0 }
  AC: { number: 3, datatype: 4 }

allow_other_rules: false
waive_rule_ids:
  - AC.L1
  - AC.R1
  - AC.S1
  - AC.W1
  - AC.XY
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - CC.W1
  - CC.S1

cases:
  # ==========================================
  # 正常系：ACの境界から、全方向ぴったり 2.9μm 内側にCOを配置 -> PASS
  # ==========================================
  - name: pass_enclose_2p9
    shapes:
      AC:
        - [0.0, 0.0, 20.0, 20.0]
      CO:
        # 0.0 + 2.9 = 2.9 / 20.0 - 2.9 = 17.1
        # 上下左右すべてACの端から 2.9 離れた位置に配置
        - [2.9, 2.9, 17.1, 17.1]
    expected_violations: 0

  # ==========================================
  # 異常系①：左辺(X方向)を 2.85 に近づける -> FAIL
  # ==========================================
  - name: fail_enclose_x_2p85
    shapes:
      AC:
        - [0.0, 0.0, 20.0, 20.0]
      CO:
        # 左端を 2.85 までACの端(0.0)に近づける
        - [2.85, 2.9, 17.1, 17.1]
    # エッジベースまたは図形単位での検出を想定し、まずは 1 を設定
    expected_violations: 1

  # ==========================================
  # 異常系②：下辺(Y方向)を 2.85 に近づける -> FAIL
  # ==========================================
  - name: fail_enclose_y_2p85
    shapes:
      AC:
        - [0.0, 0.0, 20.0, 20.0]
      CO:
        # 下端を 2.85 までACの端(0.0)に近づける
        - [2.9, 2.85, 17.1, 17.1]
    expected_violations: 1