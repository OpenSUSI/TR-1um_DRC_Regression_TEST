rule_id: CC.S1

layers:
  CO: { number: 11, datatype: 0 }
  AC: { number: 3, datatype: 4 } # キャパシタ用下地

allow_other_rules: false
waive_rule_ids:
  # 下地やCO単体のルール、先ほどPASSした幅チェック（CC.W1）などをすべてWaive
  - AC.L1
  - AC.R1
  - AC.S1
  - AC.W1
  - AC.XY
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - CC.W1 # 先ほどクリアした幅チェックルールを追加

cases:
  # ==========================================
  # 正常系：2つのCOの間隔（Space）をぴったり 1.2μm にする -> PASS
  # ==========================================
  - name: pass_space_1p2
    shapes:
      AC:
        - [-5.0, -5.0, 15.0, 15.0]
      CO:
        # 1つ目のCO (1.2 x 1.2)
        - [0.0, 0.0, 1.2, 1.2]
        # 2つ目のCO (1.2 x 1.2) をX方向に 1.2 離して配置 (1.2 + 1.2 = 2.4)
        - [2.4, 0.0, 3.6, 1.2]
    expected_violations: 0

  # ==========================================
  # 異常系①：X方向の間隔を 1.15μm に縮める -> FAIL
  # ==========================================
  - name: fail_space_x_1p15
    shapes:
      AC:
        - [-5.0, -5.0, 15.0, 15.0]
      CO:
        - [0.0, 0.0, 1.2, 1.2]
        # 間隔を 1.15 に縮める (1.2 + 1.15 = 2.35)
        - [2.35, 0.0, 3.55, 1.2]
    # 対向するエッジの検出、またはエラー領域の1カウントを想定して 1
    expected_violations: 1

  # ==========================================
  # 異常系②：Y方向の間隔を 1.15μm に縮める -> FAIL
  # ==========================================
  - name: fail_space_y_1p15
    shapes:
      AC:
        - [-5.0, -5.0, 15.0, 15.0]
      CO:
        - [0.0, 0.0, 1.2, 1.2]
        # Y方向に間隔 1.15 で上に配置 (1.2 + 1.15 = 2.35)
        - [0.0, 2.35, 1.2, 3.55]
    expected_violations: 1