rule_id: CC.W1

layers:
  CO: { number: 11, datatype: 0 }
  AC: { number: 3, datatype: 4 } # キャパシタ用下地

allow_other_rules: false
waive_rule_ids:
  - AC.L1
  - AC.R1
  - AC.S1
  - AC.W1
  - AC.XY
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3

cases:
  # ==========================================
  # 正常系：X幅もY幅もぴったり 1.2 の正方形にする -> PASS
  # ==========================================
  - name: pass_width_1p2
    shapes:
      AC:
        - [-5.0, -5.0, 15.0, 15.0]
      CO:
        - [0.0, 0.0, 1.2, 1.2]
    expected_violations: 0

  # ==========================================
  # 異常系①：X方向の幅を 1.15 に縮める (Y方向は十分長い 2.0) -> FAIL
  # ==========================================
  - name: fail_width_x_1p15
    shapes:
      AC:
        - [-5.0, -5.0, 15.0, 15.0]
      CO:
        - [0.0, 0.0, 1.15, 2.0]
    expected_violations: 1

  # ==========================================
  # 異常系②：Y方向の幅を 1.15 に縮める (X方向は十分長い 2.0) -> FAIL
  # ==========================================
  - name: fail_width_y_1p15
    shapes:
      AC:
        - [-5.0, -5.0, 15.0, 15.0]
      CO:
        - [0.0, 0.0, 2.0, 1.15]
    expected_violations: 1