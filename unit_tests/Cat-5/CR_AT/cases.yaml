rule_id: CR.AT

layers:
  CO: { number: 11, datatype: 0 }
  AR: { number: 3, datatype: 3 }
  WN: { number: 140, datatype: 0 }  # 抵抗体をツールに認識させるための物理下地

allow_other_rules: false
waive_rule_ids:
  # 今回のチェックに関係のないARの形状や、コンタクトの単体ルールをすべて無視
  - AR.L1
  - AR.W1
  - AR.XY
  - AR.WR
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - CR.W1
  - CR.W2
  - GC.R1
  - GC.R2

cases:
  # ==========================================
  # 正常系：ARの上側のフチから、COがぴったり 1.5μm 内側にある -> PASS
  # ==========================================
  - name: pass_enclose_1p5
    shapes:
      WN:
        - [-5.0, -5.0, 20.0, 20.0]
      AR:
        - [0.0, 0.0, 10.0, 10.0]     # ARの上端は Y=10.0
      CO:
        # ARの上端(10.0)から、ぴったり1.5引いた位置(Y=8.5)にCOの上端を配置
        - [4.5, 7.5, 5.5, 8.5]       # 1.0 x 1.0 のコンタクト
    expected_violations: 0

  # ==========================================
  # 異常系：COを上側のフチに 1.45μm まで近づける（包み込み不足） -> FAIL
  # ==========================================
  - name: fail_enclose_1p45
    shapes:
      WN:
        - [-5.0, -5.0, 20.0, 20.0]
      AR:
        - [0.0, 0.0, 10.0, 10.0]     # ARの上端は Y=10.0
      CO:
        # ARの上端(10.0)から、1.45引いた位置(Y=8.55)までCOを上に持ち上げる
        - [4.5, 7.55, 5.5, 8.55]
    # エッジベースで違反が出るため、対向する1辺（または図形全体）で 1 を想定
    expected_violations: 1