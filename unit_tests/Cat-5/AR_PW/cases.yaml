rule_id: AR.PW

layers:
  GC: { number: 8, datatype: 1 }
  WN: { number: 140, datatype: 0 }
  AR: { number: 3, datatype: 3 }

allow_other_rules: false
waive_rule_ids:
  - GC.W1
  - GC.S1
  - GC.R1
  - GC.R2
  - WN.S1
  - WN.S6
  - WN.W1
  - WN.Z1
  - WN.Z2
  - WN.Z3
  - AR.XY
  - AR.S1
  - AR.W1
  - AR.L1
  - AR.WR

cases:
  # ==========================================
  # 正常系：四角ドーナツ型の帯の幅を 2.00 ピッタリにする (Wmin=2.0) -> PASS
  # 外枠 [0, 0, 10, 10] から、内空 [2.0, 2.0, 8.0, 8.0] を除いた4つの矩形
  # ==========================================
  - name: pass_width_2p00
    shapes:
      WN: [[-5.0, -5.0, 15.0, 15.0]]
      AR: [[-5.0, -5.0, 15.0, 15.0]]
      GC:
        - [0.0, 0.0, 10.0, 2.00]    # 下の帯 (幅 2.00)
        - [0.0, 8.00, 10.0, 10.0]   # 上の帯 (幅 2.00)
        - [0.0, 2.00, 2.00, 8.00]   # 左の帯 (幅 2.00)
        - [8.00, 2.00, 10.0, 8.00]  # 右の帯 (幅 2.00)
    expected_violations: 0

  # ==========================================
  # 異常系：Wmin違反 (境界値テスト: 1.95) -> 違反数: 4 (上下左右の4辺分)
  # 外枠 [0, 0, 10, 10] から、内空 [1.95, 1.95, 8.05, 8.05] を除いた4つの矩形
  # ==========================================
  - name: fail_width_1p95
    shapes:
      WN: [[-5.0, -5.0, 15.0, 15.0]]
      AR: [[-5.0, -5.0, 15.0, 15.0]]
      GC:
        - [0.0, 0.0, 10.0, 1.95]    # 下の帯 (幅 1.95 < 2.0)
        - [0.0, 8.05, 10.0, 10.0]   # 上の帯 (幅 1.95 < 2.0)
        - [0.0, 1.95, 1.95, 8.05]   # 左の帯 (幅 1.95 < 2.0)
        - [8.05, 1.95, 10.0, 8.05]  # 右の帯 (幅 1.95 < 2.0)
    expected_violations: 4