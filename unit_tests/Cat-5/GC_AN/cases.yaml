rule_id: GC.AN

layers:
  GC: { number: 8, datatype: 1 }
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  - GC.W1
  - GC.S1
  - AN.W1
  - AN.S1

cases:
  # ==========================================
  # 正常系：GCとANの間隔を 0.40 ピッタリにする (Smin=0.4) -> PASS
  # エンジン側は「< 0.4」で判定しているため、0.40は違反にならない
  # ==========================================
  - name: pass_space_0p40
    shapes:
      GC: [[0.0, 0.0, 10.0, 10.0]]
      AN: [[10.40, 0.0, 20.40, 10.0]] # 間隔: 10.40 - 10.0 = 0.40
    expected_violations: 0

  # ==========================================
  # 異常系：Smin違反 (境界値テスト: 0.35) -> 違反数: 1
  # ==========================================
  - name: fail_space_0p35
    shapes:
      GC: [[0.0, 0.0, 10.0, 10.0]]
      AN: [[10.35, 0.0, 20.35, 10.0]] # 間隔: 10.35 - 10.0 = 0.35
    expected_violations: 1