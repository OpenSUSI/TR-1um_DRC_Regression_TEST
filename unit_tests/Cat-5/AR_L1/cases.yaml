rule_id: AR.L1

layers:
  AR: { number: 3, datatype: 3 }
  GC: { number: 8, datatype: 1 }
  GR: { number: 8, datatype: 2 }
  CO: { number: 11, datatype: 0 }
  M1: { number: 13, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - AR.W1
  - AR.S1
  - AR.XY
  - GC.R1
  - GC.R2
  - GC.W1
  - GC.S1
  - GR.L1
  - GR.S1
  - GR.W1
  - CO.GC
  - CO.S1
  - CO.W1
  - CO.Z1
  - CO.Z3
  - M1.CL
  - M1.S1
  - M1.W1
  - CR.AS
  - CR.W2
  - CR.AT

cases:
  # ==========================================
  # 正常系：Lを 20.0 にする (Wは10.0で固定) -> PASS
  # ==========================================
  - name: pass_length_20p0
    shapes:
      AR: [[0.0, 0.0, 10.0, 26.0]]
      GC: [[-1.0, 1.0, 11.0, 25.0]]
      GR: [[-1.0, 1.0, 11.0, 25.0]]
      CO: 
        - [0.0, 1.0, 10.0, 3.0]
        - [0.0, 23.0, 10.0, 25.0]
      # 間隔 = 23.0 - 3.0 = 20.0 (13.0〜100.0内)
      M1: [[-1.0, 1.0, 11.0, 25.0]]
    expected_violations: 0

  # ==========================================
  # 異常系①：Lmin違反 (境界値テスト: 12.9) -> 違反数: 2
  # ==========================================
  - name: fail_lmin_12p9
    shapes:
      AR: [[0.0, 0.0, 10.0, 18.9]]
      GC: [[-1.0, 1.0, 11.0, 17.9]]
      GR: [[-1.0, 1.0, 11.0, 17.9]]
      CO: 
        - [0.0, 1.0, 10.0, 3.0]
        - [0.0, 15.9, 10.0, 17.9]
      # 間隔 = 15.9 - 3.0 = 12.9 (< 13.0)
      M1: [[-1.0, 1.0, 11.0, 17.9]]
    expected_violations: 2

  # ==========================================
  # 異常系②：Lmax違反 (境界値テスト: 100.1) -> 違反数: 2
  # ==========================================
  - name: fail_lmax_100p1
    shapes:
      AR: [[0.0, 0.0, 10.0, 106.1]]
      GC: [[-1.0, 1.0, 11.0, 105.1]]
      GR: [[-1.0, 1.0, 11.0, 105.1]]
      CO: 
        - [0.0, 1.0, 10.0, 3.0]
        - [0.0, 103.1, 10.0, 105.1]
      # 間隔 = 103.1 - 3.0 = 100.1 (> 100.0)
      M1: [[-1.0, 1.0, 11.0, 105.1]]
    expected_violations: 2