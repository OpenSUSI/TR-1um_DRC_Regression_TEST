rule_id: WN.Z3

layers:
  WN: { number: 140, datatype: 0 }
  AP: { number:  3, datatype: 1 }
  AN: { number:  3, datatype: 2 }
  AR: { number:  3, datatype: 3 }
  AC: { number:  3, datatype: 4 }

allow_other_rules: false
waive_rule_ids:
  # 連鎖して発生しそうな単体エラーや、先ほど対応したAC.R1、
  # および同じ下地で発火する可能性のあるWN.Z2をあらかじめWaiveに登録しておきます！
  - WN.W1
  - WN.S1
  - AC.W1
  - AC.S1
  - AC.R1
  - AR.W1
  - AR.S1
  - AR.L1
  - WN.Z2
  - AR.XY
  - GC.R1

cases:
  - name: pass_WN_C_AN
    shapes:
      WN: [-30, -30, 30, 30]
      AC: [-15, -15, 15, 15] # WNの中にACを敷いて「WN(C)」にする
      AN: [-10, -10, 10, 10] # AR以外（AN）を置くのは安全（PASS）
    expected_violations: 0

  - name: fail_WN_C_AR
    shapes:
      WN: [-30, -30, 30, 30]
      AC: [-15, -15, 15, 15] # WNの中にACを敷いて「WN(C)」にする
      AR: [-10, -10, 10, 10] # 禁忌である「WN(C)の上のAR」を配置（これでWN.Z3を発火！）
    expected_violations: 1