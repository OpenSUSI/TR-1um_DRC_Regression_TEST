rule_id: PO.Z3

layers:
  PO: { number: 14, datatype: 0 }
  V1: { number: 19, datatype: 0 }
  M1: { number: 13, datatype: 0 }
  M2: { number: 20, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  # 単体エラーや囲み不足、連鎖エラーをあらかじめ徹底的に無視
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - V1.W1
  - V1.S1
  - V1.M1
  - V1.M2
  - V1.Z1
  - V1.Z2
  - M1.W1
  - M1.S1
  - M1.PO
  - M2.W1
  - M2.S1
  - M2.PO
  - M1.W3
  - M2.W3
  - V1.WP

cases:
  # パターン1：V1がPOの「内側（真下）」にある状態（前回 Actual: 0 だったのでこれが正解！）
  - name: pass_V1_inside_PO
    shapes:
      M1: [-30, -30, 30, 30]
      M2: [-30, -30, 30, 30]
      PO: [-15, -15, 15, 15]
      V1: [-2, -2, 2, 2]        # POの枠内に収まっているので安全（PASS）
    expected_violations: 0

  # パターン2：V1がPOの「外側」にある状態（前回 Actual: 1 だったのでこれがルール違反！）
  - name: fail_V1_outside_PO
    shapes:
      M1: [-30, -30, 30, 30]
      M2: [-30, -30, 30, 30]
      PO: [-15, -15, 15, 15]
      V1: [-25, -25, -23, -23]  # POの枠外に配置されているためエラー（FAIL）
    expected_violations: 1