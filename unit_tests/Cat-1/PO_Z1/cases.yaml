rule_id: PO.Z1

layers:
  PO: { number: 14, datatype: 0 } 
  M1: { number: 13, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  # POの単体エラーや、M2・V1を置いていないことで必ず出るエラー(PO.Z2, PO.Z3)を無視
  - PO.W1
  - PO.S1
  - PO.Z2
  - PO.Z3
  - M1.W1
  - M1.S1
  - M1.PO # M1がPOを囲むマージン不足エラーを想定して無視
  - M1.W3

cases:
  # パターン1：POの下にM1の土台が正しく敷かれている状態（PASS）
  - name: pass_PO_on_M1
    shapes:
      M1: [-30, -30, 30, 30] # パッドを支える強固なM1の土台
      PO: [-15, -15, 15, 15] # 土台の上に開口されたPO（安全 = PASS）
    expected_violations: 0

  # パターン2：POの下にM1がない（土台のない危険なPO = FAIL）
  - name: fail_PO_floating
    shapes:
      # 意図的に M1 の土台を配置しない！
      PO: [-15, -15, 15, 15] # 何もない空間にPOだけを配置（これで PO.Z1 が発火！）
    expected_violations: 1